<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Components · Media Manager design library</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/tokens.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/components.css"
    />
    <link rel="stylesheet" href="assets/gallery.css" />
  </head>
  <body class="ds g" data-page="components.html">
    <script src="assets/ds.js"></script>
    <script>
      const D = DS
      const {
        g,
        btn,
        play,
        pill,
        pills,
        count,
        status,
        mark,
        rating,
        tabs,
        workspaceTabs,
        seg,
        table,
        card,
        row,
        section,
        icon,
      } = D
      const A = D.data.ALBUMS
      const F = D.data.FILMS
      const albumMeta = (a) => [`<span>${a.year}</span>`, rating('RYM', a.rym)]
      const rowMeta = (a) => [
        `<span class="ds-w-rating">${rating('RYM', a.rym)}</span>`,
        `<span class="ds-w-num">${a.plays}</span>`,
        `<span class="ds-w-date">${a.added}</span>`,
      ]
      const fixed = (html, width) =>
        `<div style="width:${width}px">${html}</div>`
      const sortFields = [
        ['Added', true],
        ['Released'],
        ['Title'],
        ['Artists'],
        ['Tracks'],
        ['Scrobbles'],
        ['Scrobbles, last year'],
        ['Last listened'],
        ['RYM rating'],
      ]
      /* Tracks with what each is made of: rows for the part and group row
         specs. A part row has part: true and the provider its title is from. */
      const T = D.data.TRACKS
      const partCols = [
        {
          h: '<input type="checkbox" class="ds-check" aria-label="Select all" />',
          raw: true,
          w: 36,
          c: (r) =>
            r.part
              ? ''
              : `<input type="checkbox" class="ds-check" aria-label="Select ${D.esc(r.title)}" />`,
        },
        {
          h: 'Track',
          c: (r) =>
            r.part
              ? D.partTitle(r.p, r.title)
              : `<span class="ds-cell-id">${
                  r.toggle
                    ? D.partToggle(
                        `${r.open ? 'Hide' : 'Show'} what ${r.title} is made of`,
                        r.open,
                      )
                    : D.PART_SLOT
                }${D.thumb(r)}<a class="ds-cell-title" href="#">${D.esc(r.title)}</a>${play('row')}</span>`,
        },
        { h: 'Artist', c: (r) => D.esc(r.by) },
        { h: 'Length', end: true, c: (r) => r.duration || D.EMPTY },
        {
          h: 'Scrobbles',
          end: true,
          c: (r) => (r.plays === undefined ? D.EMPTY : r.plays),
        },
        { h: 'Made of', c: (r) => r.made },
      ]
      const partRows = (r) => (r.part ? { 'data-part': '' } : {})
      /* Similar: TIDAL's suggestions for one album or track, in its drawer */
      const suggestionOf =
        (kind) =>
        ([title, by, meta, state, seed, genres]) => ({
          kind,
          title,
          by,
          meta,
          state,
          seed,
          genres,
        })
      const SIM_ALBUMS = [
        ['Pressure Systems', 'Halcyon Grid', '2023', 'library', 3, ['Ambient']],
        [
          'Night Shift Utopia',
          'Vela Rooms',
          '2024',
          'spotify',
          8,
          ['House', 'Deep House'],
        ],
        ['Tunnel Vision EP', 'Oskar Brandt', '2022', 'spotify', 1],
        ['Low Orbit Dubs', 'Sable & Rue', '2021', 'library', 10],
        ['Concrete Bloom', 'Mirela Tan', '2025', 'none', 4],
        ['Rotary Club Mixes', 'Dovetail Unit', '2020', 'spotify', 6],
        ['Strobe Hymnal', 'Kessler & Moss', '2024', 'unsearched', 9],
        ['Second Floor', 'Ayla Ren', '2023', 'library', 2],
      ].map(suggestionOf('album'))
      const SIM_TRACKS = [
        ['Glass Arcade', 'Halcyon Grid', 'Pressure Systems', 'library', 3],
        [
          'Afterhours Telex',
          'Vela Rooms',
          'Night Shift Utopia',
          'spotify',
          8,
          ['Deep House'],
        ],
        ['Halogen', 'Oskar Brandt', 'Tunnel Vision EP', 'spotify', 1],
        ['Wet Pavement', 'Lumen Drift', 'Soft Transit', 'library', 10],
        ['Lantern Code', 'Mirela Tan', 'Concrete Bloom', 'none', 4],
        ['Carousel Theory', 'Dovetail Unit', '', 'spotify', 6],
        [
          'Tape Echo Prayer',
          'Kessler & Moss',
          'Strobe Hymnal',
          'unsearched',
          9,
        ],
      ]
        .map(suggestionOf('track'))
        .map((track, index) => ({
          ...track,
          hasDetail: index < 5,
          duration: ['3:45', '4:20', '5:13', '2:58', '4:31', '3:40', '5:02'][
            index
          ],
        }))
      const SIM_ALBUM = { kind: 'album', seed: 7, title: 'Afterglow Circuit' }
      const SIM_TRACK = { kind: 'track', seed: 7, title: 'Signal Fade' }
      const simCounts = (list) => {
        if (list[0]?.kind === 'track') return `${list.length} from TIDAL`
        const n = (st) => list.filter((s) => s.state === st).length
        return `${list.length} from TIDAL · ${n('library')} in library · ${n('spotify')} on Spotify`
      }
      const simList = (items, o = {}) =>
        `<div class="ds-list" data-compact>${items.map((s, i) => D.suggestion(s, { state: i === o.hover ? 'hover' : undefined })).join('')}</div>`
      const simSummary = (list) =>
        `<div class="ds-filterline"><span class="ds-toolbar-count">${simCounts(list)}</span>${btn('', { icon: 'refresh', size: 'xs', variant: 'ghost', aria: 'Read again from TIDAL', title: 'Read again from TIDAL · updated 2026-11-20' })}</div>`
      const simEmbedded = (html) =>
        `<div style="margin-inline:calc(var(--ds-gutter) * -1)">${html}</div>`
      const similar = (list, o = {}) => {
        const content = simSummary(list) + simList(list, o)
        return list[0]?.kind === 'track' ? content : simEmbedded(content)
      }
      const simAlbumHead = (o = {}) =>
        D.detailHead({
          item: SIM_ALBUM,
          kind: 'Album',
          by: 'by <a href="#">Lumen Drift</a>',
          facts: ['2024-05-17', '9 tracks', '51:20', 'Northbound Audio'],
          play: play('header'),
          links: D.logoLinks(['spotify', 'lastfm', 'discogs']),
          actions: o.phone ? undefined : D.headActions(),
        })
      const simTrackHead = (o = {}) =>
        D.detailHead({
          item: SIM_TRACK,
          kind: 'Track',
          by: 'by <a href="#">Lumen Drift</a> · on <a href="#">Afterglow Circuit</a>',
          facts: ['6:12', 'Track 4 of 9', '2024'],
          play: play('header'),
          links: D.logoLinks(['spotify', 'lastfm']),
          actions: o.phone ? undefined : D.headActions(),
        })
      const SIM_ALBUM_TABS = [
        'Overview',
        'Similar',
        'Listening',
        'Sources',
        'Edit',
      ]
      const SIM_TRACK_TABS = ['Overview', 'Similar', 'Sources']
      const simFrame = (html, h) =>
        `<div class="g-inspector" style="--g-h:${h}px">${html}</div>`
      const simAlbumDrawer = (body) =>
        D.inspector({
          crumbs: ['Albums', SIM_ALBUM.title],
          head: simAlbumHead(),
          tabs: SIM_ALBUM_TABS,
          tab: 1,
          body,
        })
      const simTrackDrawer = (body) =>
        D.inspector({
          crumbs: ['Tracks', SIM_TRACK.title],
          head: simTrackHead(),
          tabs: SIM_TRACK_TABS,
          tab: 1,
          body,
        })
      const simBox = (title, text, action) =>
        D.state(title, text, { size: 'sm', action })
      const simStates = [
        [
          `<div class="ds-filterline">${status('running', 'Reading from TIDAL')}</div><div class="ds-list" data-compact>${D.skelRow().repeat(3)}</div>`,
          'Loading: the TIDAL match or read is running. While matching, the status reads Matching on TIDAL.',
        ],
        [
          `<div class="ds-filterline">${status('running', 'Finding on Spotify')}</div>${simList(SIM_ALBUMS.slice(4, 7))}`,
          'Only the Spotify lookup is queued or running: the list, with the status in place of the counts',
        ],
        [
          simBox(
            'Not matched on TIDAL',
            'Similar albums come from TIDAL.',
            btn('Match on TIDAL', { size: 'xs' }),
          ),
          'Not matched: the button runs the TIDAL match. After a failed match, its error is the text.',
        ],
        [
          simBox(
            'TIDAL has no similar albums',
            'Read 2026-11-20',
            btn('Read again', { icon: 'refresh', size: 'xs' }),
          ),
          'Nothing found',
        ],
        [
          simBox(
            'Could not read from TIDAL',
            'TIDAL is waiting until 14:20 after a rate limit.',
            btn('Read again', { icon: 'refresh', size: 'xs' }),
          ),
          'The read failed and there is no earlier read: the job’s error is the text',
        ],
      ]
      const simPhoneNow = `<div class="g-phone-now">${D.artBox({ kind: 'album', seed: 3 })}<div class="ds-row-main"><span class="ds-row-title">Glass Arcade</span><span class="ds-row-by">Halcyon Grid · Kitchen</span></div><span class="ds-actions ds-toolbar-end">${btn('', { icon: 'pause', variant: 'ghost', aria: 'Pause' })}${btn('', { icon: 'next', variant: 'ghost', aria: 'Next' })}</span></div>`
      const simPhoneTabs = (current) =>
        `<div class="g-phone-tabs">${[
          ['disc', 'Albums'],
          ['music', 'Tracks'],
          ['user', 'Artists'],
          ['film', 'Films'],
          ['more', 'More'],
        ]
          .map(
            ([ic, label]) =>
              `<span${label === current ? ' aria-current="page"' : ''}>${icon(ic)}${label}</span>`,
          )
          .join('')}</div>`
      const simPhone = (o) =>
        `<div class="g-phone"><div class="ds-inspector-bar">${btn('', { icon: 'chevL', variant: 'ghost', aria: 'Back' })}<div class="ds-crumbs"><b>${D.esc(o.title)}</b></div>${btn('', { icon: 'more', variant: 'ghost', aria: 'More actions' })}</div><div class="g-phone-scroll" data-touch style="padding:var(--ds-5)">${o.body}</div>${simPhoneNow}${simPhoneTabs(o.nav)}</div>`

      const viewSection = `<div class="g-stack" style="justify-items:start">${seg(['Compact', 'Standard', 'Roomy'], 1, { label: 'Grid size' })}<span class="ds-label">On cards</span>${D.checkRow('Rating', true)}${D.checkRow('Sorted value', true)}${D.checkRow('Tags', true)}${D.checkRow('Include archived imports', false)}</div>`

      D.page({
        title: 'Components',
        lede: 'Each component below replaces several variants in the app today. Class names are prefixed <code>ds-</code>; the markup comes from the template functions in <code>assets/ds.js</code>, which a React port should reproduce.',
        sections: [
          {
            id: 'button',
            title: 'Button',
            body:
              g.spec(
                g.flow([
                  g.item(
                    btn('Play', {
                      icon: 'play',
                      variant: 'primary',
                      size: 'md',
                    }),
                    'primary · 32',
                  ),
                  g.item(
                    btn('Queue', { icon: 'queue', size: 'md' }),
                    'default · 32',
                  ),
                  g.item(btn('Filters', { icon: 'filter' }), 'default · 28'),
                  g.item(
                    btn('Open page', { icon: 'expand', variant: 'ghost' }),
                    'ghost · 28',
                  ),
                  g.item(
                    btn('Retry', { icon: 'refresh', size: 'xs' }),
                    'default · 24',
                  ),
                  g.item(btn('Disconnect', { variant: 'danger' }), 'danger'),
                  g.item(btn('View all', { variant: 'link' }), 'link'),
                  g.item(
                    btn('', { icon: 'more', aria: 'More actions' }),
                    'icon',
                  ),
                  g.item(
                    btn('', { icon: 'x', variant: 'ghost', aria: 'Close' }),
                    'icon ghost',
                  ),
                  g.item(
                    btn('List', { icon: 'list', pressed: true }),
                    'pressed',
                  ),
                  g.item(
                    btn('Refresh', { icon: 'refresh', disabled: true }),
                    'disabled',
                  ),
                ]),
              ) +
              g.rules([
                '<b>Three heights.</b> 24 inside table rows, 28 in toolbars and panels, 32 in forms and detail headers. Icon buttons are square at the same heights.',
                '<b>One primary per view.</b> Everything else is default or ghost. Slate fill is not used for anything except the primary action, the play toggle in the dock and the selection bar.',
                '<b>Danger</b> is for actions that remove or disconnect. Each one asks for confirmation in a popover anchored to the button.',
                '<b>Fixed wording.</b> Retry, Refresh, Cancel, Close and Open page keep the same label, icon and size wherever they appear.',
              ]) +
              g.note(
                'Replaces',
                'the shared Button plus about as many hand-styled buttons, in nine heights from 20 to 40px. Retry exists in six styles and Close at four sizes.',
              ),
          },
          {
            id: 'action-feedback',
            title: 'Button feedback',
            body:
              g.spec(
                g.flow([
                  btn('Adding…', { feedback: 'pending', icon: 'clock' }),
                  btn('Added', { feedback: 'done', icon: 'check' }),
                  btn('Queued', { feedback: 'queued', icon: 'layers' }),
                  btn('Fetching page 2', {
                    feedback: 'running',
                    icon: 'activity',
                  }),
                  btn('Waiting to retry', {
                    feedback: 'waiting',
                    icon: 'clock',
                  }),
                  btn('Retry link', { feedback: 'failed', icon: 'alert' }),
                ]),
              ) +
              g.rules([
                'Put a short verb or result together with an icon on the control that started the action. A direct save can show Added as soon as membership is confirmed.',
                'Use the returned job to show Queued, Running, Waiting and its actual outcome. Keep job evidence openable from the result.',
                'Show each phase once. Beside the control, keep details such as counts, failure reasons and job links. Show a separate confirmation when the control disappears.',
                'Keep the control and its neighbors in the same positions when its phase changes. Compact buttons keep their icon slot, with the full phase in the accessible name and tooltip. Seek and volume use the slider and its existing value.',
                'Identify saved steps and remaining work when an operation partially succeeds. Keep duplicate submissions disabled where appropriate and expose recovery at the affected item.',
                'Use the result in the same slot after a confirmation closes. If results replace the trigger or navigation changes the screen, carry the receipt to the surviving view.',
              ]),
          },
          {
            id: 'play',
            title: 'Play control',
            body:
              `<p>Play comes first, followed by Add to queue. In Browse, selecting a provider adds its item link after Queue. Films and artists show the link on its own. Each provider link opens a new tab.</p>` +
              g.spec(
                g.flow(
                  [
                    g.item(
                      fixed(card(A[0], { meta: albumMeta(A[0]) }), 148),
                      'tile · at rest',
                    ),
                    g.item(
                      fixed(
                        card(A[1], { meta: albumMeta(A[1]), state: 'hover' }),
                        148,
                      ),
                      'tile · hover, focus, touch',
                    ),
                    g.item(
                      fixed(
                        card(A[2], { meta: albumMeta(A[2]), state: 'playing' }),
                        148,
                      ),
                      'tile · playing',
                    ),
                    g.item(
                      fixed(
                        table(
                          D.COLS.albumTracks.slice(0, 3),
                          D.data.ALBUM_TRACKS.slice(0, 4),
                          {
                            row: (r, i) => ({
                              'data-state':
                                i === 1
                                  ? 'playing'
                                  : i === 2
                                    ? 'hover'
                                    : undefined,
                            }),
                          },
                        ),
                        330,
                      ),
                      'row · at rest, playing, hover',
                    ),
                    g.item(
                      `<span data-state="hover">${play('row', { provider: 'discogs' })}</span>`,
                      'row · filtered by Discogs',
                    ),
                    g.item(
                      `<div class="ds-detail-head"><div class="ds-detail-side">${D.artBox(A[3])}<div class="ds-detail-play">${play('header')}</div></div></div>`,
                      'header · under the artwork',
                    ),
                  ],
                  { top: true },
                ),
              ) +
              g.rules([
                '<b>Tile.</b> One white pill at the bottom right of the artwork. Hidden at rest on pointer devices, shown on hover and keyboard focus, always shown on touch and while the item is playing.',
                '<b>Row.</b> The same pair at the end of the title cell, in lists and tables alike. The space is reserved, so nothing moves when it appears.',
                '<b>Header.</b> Under the artwork and exactly as wide as it. Play is the labelled primary button and takes the room that Queue, a square icon button, leaves.',
                '<b>No inline play icons</b> beside album or playlist names inside another row. Follow the link, then play.',
                '<b>Playing state.</b> The pair stays visible and Play becomes Pause.',
              ]) +
              g.note(
                'Replaces',
                'nine play controls in four positions: dark circles over artwork, bare icons before the title, a dedicated playback column, and trailing icons at the far end of the row.',
              ),
          },
          {
            id: 'library-action',
            title: 'Add to Library',
            body:
              g.spec(
                g.flow([
                  g.item(D.libraryAction('track', 'Glass Meridian'), 'Add'),
                  g.item(
                    D.libraryAction('track', 'Glass Meridian', { added: true }),
                    'Confirmed',
                  ),
                  g.item(
                    btn('', {
                      icon: 'search',
                      size: 'xs',
                      variant: 'ghost',
                      aria: 'Match Glass Meridian to Spotify',
                    }),
                    'Match track',
                  ),
                  g.item(
                    D.libraryAction('film', 'Paper Harbor', { pending: true }),
                    'Adding',
                  ),
                ]),
              ) +
              g.rules([
                'Use the outlined book with a plus for an item outside the library. A catalog item can already have a detail page and still be eligible for Add. Show Adding… on activation and Added in the same place after a successful save. Announce the result to screen readers. Keep the detail link when returning to a previously saved item.',
                'Include the item kind and title in the tooltip and accessible name.',
                'Put the action beside the title in the player or beside the service link in external results. Use the larger touch target beside the title on the phone player.',
                'In queue rows, keep action space separate from the truncated text and leave the library slot empty for saved items. Use secondary label ink at rest and the shared ghost button hover and focus states.',
                'An album title opens its identified release. Place manual Spotify search beside the title of an unmatched library track. Offer Add once membership is known. Adding to the library preserves playback and queue order.',
              ]),
          },
          {
            id: 'pill',
            title: 'Pill, count and provider logo',
            body:
              g.spec(
                g.flow([
                  g.item(pill('Dream Pop'), 'tag · 20'),
                  g.item(pill('Dream Pop', { size: 'md' }), 'tag · 24'),
                  g.item(
                    pill('Dream Pop', { size: 'md', sources: true }),
                    'tag on a detail page · sources',
                  ),
                  g.item(
                    pill('Shoegaze', { mode: 'any', remove: true }),
                    'filter · any',
                  ),
                  g.item(
                    pill('Ethereal', { mode: 'required', remove: true }),
                    'filter · required',
                  ),
                  g.item(
                    pill('Live', { mode: 'exclude', remove: true }),
                    'filter · excluded',
                  ),
                  g.item(
                    pill('Needs ID', { tone: 'attention', static: true }),
                    'attention',
                  ),
                  g.item(
                    pill('Metadata', { tone: 'outline', static: true }),
                    'outline · role',
                  ),
                  g.item(
                    `<span class="ds-actions">${count(12)}${count(3, 'attention')}${count(1, 'danger')}</span>`,
                    'count',
                  ),
                  g.item(
                    fixed(pills(A[0].tags, { max: 2 }), 170),
                    'overflow: what fits, then +N',
                  ),
                ]),
              ) +
              g.rules([
                '<b>One shape.</b> Fully rounded, 20px in rows and cards, 24px in detail sections and filter rails.',
                '<b>A pill is never cut off.</b> A row of pills shows the ones that fit and a <code>+N</code> count. The full set is in the detail panel.',
                '<b>Clicking a tag filters</b> the current library by it, everywhere.',
                '<b>Tag names are in title case</b> whatever case their source used: Indie Rock, Based on Novel or Book, UK Garage. One formatter writes them; the stored name and the filter value are not changed.',
                '<b>A tag on a detail overview carries a sources icon</b> inside the pill. It explains why that tag appears on the open item and links to the contributing album or artist, provider pages and jobs when available. Browse rows, cards and tables show the tag alone.',
                '<b>The label keeps its descenders.</b> The pill has a line of 1; the label inside has the body line height, so the clip that shortens a long tag never cuts a g, p or y.',
              ]) +
              g.note(
                'Replaces',
                'about ten pill styles, tags as pills in some tables and comma text in others, and three different click behaviours.',
              ) +
              g.sub('Provider logo') +
              g.spec(
                g.flow(
                  [
                    ...[
                      'spotify',
                      'tidal',
                      'lastfm',
                      'musicbrainz',
                      'discogs',
                      'rym',
                      'tmdb',
                      'youtube',
                      'imdb',
                    ].map((id) => g.item(mark(id), D.PROVIDERS[id].name)),
                    g.item(mark('omdb'), 'OMDb · no logo'),
                    g.item(
                      `<span class="ds-actions">${mark('spotify', { size: 'sm' })}${mark('discogs', { size: 'sm' })}${mark('omdb', { size: 'sm' })}</span>`,
                      'small · 14',
                    ),
                    g.item(
                      D.logoLinks(['spotify', 'lastfm', 'discogs']),
                      'links · darker on hover',
                    ),
                  ],
                  { top: true },
                ),
              ) +
              g.rules([
                '<b>The provider’s own logo</b> in one muted grey (<code>--ds-ink-3</code>), drawn from the shape of its logo file. Never in brand colour.',
                '<b>16px,</b> or 14px in compact rows.',
                '<b>Inside a link</b> it turns darker on hover and keyboard focus.',
                '<b>A provider without a logo</b> shows a globe.',
                '<b>Decorative beside a name.</b> Inside a link, or next to text that names the provider, the logo is hidden from assistive technology. On its own it is an image named after the provider, with the name as its tooltip.',
              ]),
          },
          {
            id: 'status',
            title: 'Status',
            body:
              g.spec(
                g.flow([
                  status('queued'),
                  status('running'),
                  status('waiting', 'Waiting until 14:20'),
                  status('done'),
                  status('failed'),
                  status('cancelled'),
                  status('paused'),
                  status('attention', 'Needs key'),
                  status('never'),
                ]),
              ) +
              g.rules([
                '<b>One vocabulary</b> for jobs, imports, syncs, provider queues and metadata freshness: Queued, Running, Waiting, Done, Failed, Cancelled, Paused, Never.',
                '<b>Colour means state.</b> Amber is in progress or needs attention, red is failed, slate is fine. Nothing is green.',
                '<b>Waiting always says why</b> or until when: a provider cooldown, a rate limit, missing credentials.',
              ]) +
              g.spec(
                g.doc(
                  ['Today', 'Becomes'],
                  [
                    [
                      'succeeded · Complete · Imported · Listed',
                      status('done'),
                    ],
                    [
                      'Needs credentials · (needs credentials) · Credentials required',
                      `<span class="ds-actions">${status('attention', 'Needs sign-in')}${status('attention', 'Needs key')}</span>`,
                    ],
                    ['Never · Not scraped', status('never')],
                    [
                      'Cooldown · Halted · Rate limited',
                      status('waiting', 'Waiting until 14:20'),
                    ],
                  ],
                ),
                { flush: true },
              ),
          },
          {
            id: 'tabs',
            title: 'Tabs and segmented control',
            body:
              g.spec(
                g.flow(
                  [
                    g.item(
                      fixed(
                        tabs(['Overview', 'Listening', 'Sources', 'Edit'], 0),
                        320,
                      ),
                      'tabs: switch panel',
                    ),
                    g.item(
                      seg(D.VIEWS, 0, { label: 'View' }),
                      'segmented: view',
                    ),
                    g.item(

                `<div class="g-stack">${D.notice('Rate Your Music is waiting until 14:20 after a rate limit. 38 jobs are queued behind it.', { tone: 'attention', action: btn('Open provider', { size: 'xs' }) })}${D.notice('Spotify credentials were rejected. Playback and sync are stopped.', { tone: 'danger', action: btn('Reconnect', { size: 'xs' }) })}${D.notice('Scrobble names are linked in Sources, under Last.fm.')}${D.notice('Possible duplicate: “Night Drive (Remastered)” by Mira Kestrel. Same title and artist', { action: `<span class="ds-actions">${btn('Merge', { size: 'xs' })}${btn('Keep separate', { size: 'xs', variant: 'ghost' })}</span>` })}${D.notice('Merged “Nite Drive” into “Night Drive”', { icon: 'check', action: `<span class="ds-actions">${btn('Undo', { size: 'xs' })}${btn('', { icon: 'x', size: 'xs', aria: 'Dismiss' })}</span>` })}</div>`,
              ) +
              `<div class="g-cols">${g.spec(D.state('No albums match', 'Remove a filter or clear the search.', { action: btn('Clear filters') }))}${g.spec(D.state('Could not load tracks', 'The request failed.', { action: btn('Retry', { icon: 'refresh' }) }))}${g.spec(
                `<div class="g-stack">${[70, 52, 61].map((w) => `<div class="ds-skel" style="height:14px;width:${w}%"></div>`).join('')}</div>`,
              )}${g.spec(
                D.menu(
                  [
                    ['listMusic', 'Add to playlist'],
                    ['refresh', 'Refresh metadata', '', true],
                    ['external', 'Open in Spotify'],
                    ['pencil', 'Edit'],
                  ],
                  'Harbour Lights',
                ),
              )}${g.spec(
                D.menu(
                  [
                    [null, 'Filter tracks'],
                    [null, 'Filter albums'],
                    {
                      group: 'Playlist type',
                      choices: [
                        ['Automatic', true],
                        ['Album playlist'],
                        ['Track playlist'],
                      ],
                    },
                    [null, 'Open page'],
                    [null, 'Copy link'],
                  ],
                  '',
                  { label: 'More actions' },
                ),
              )}</div>` +
              g.rules([
                '<b>Notice.</b> One line, an optional single action. Neutral, attention or danger. It sits in the flow of the panel it concerns and never floats over content.',
                '<b>A notice holds two controls</b> in two cases only, in one <code>ds-actions</code> group. A suggestion the owner takes or declines has its action, then the other as a ghost button: Merge and Keep separate on a possible duplicate. The result of a change has Undo, or Redo once it is undone, then a Dismiss icon button where the notice can be closed.',
                '<b>Empty and error states</b> use the same block: what happened, what to do, one button. No illustrations.',
                '<b>Loading</b> is a skeleton of the content that will appear, not a spinner or the word Loading.',
                '<b>Popover and menu</b> share one shell: 8px radius, hairline, one shadow. The sort list, a table’s Columns list, devices, activity and confirmations all use it. A menu item that is a link looks the same as one that is a button.',
                '<b>A choice group</b> holds a setting inside a menu, such as Playlist type in a playlist’s More: its name, then the choices, the current one ticked, set apart by a hairline above and below. Choosing one saves it and closes the menu.',
              ]) +
              g.note(
                'Replaces',
                'seven popover shells, six overlay mechanisms, five confirmation patterns and empty-state wording that varies by page.',
              ),
          },
          {
            id: 'detail',
            title: 'Detail header',
            body:
              `<div class="g-cols">${[
                [
                  'Album',
                  D.detailHead({
                    item: A[0],
                    kind: 'Album',
                    by: 'by <a href="#">Mira Kestrel</a>',
                    facts: ['2019-03-08', '11 tracks', '42:18', 'Tidewater'],
                    play: play('header'),
                    links: D.logoLinks([
                      'spotify',
                      'lastfm',
                      'musicbrainz',
                      'discogs',
                      'rym',
                    ]),
                    actions: D.headActions(),
                  }),
                ],
                [
                  'Film',
                  D.detailHead({
                    item: F[0],
                    kind: 'Film',
                    by: 'directed by <a href="#">Anneke Solberg</a>',
                    facts: ['2021', '1h 52m', 'Watched 2026-09-21'],
                    links: D.logoLinks(['tmdb', 'imdb', 'letterboxd']),
                    actions: D.headActions({
                      lead: btn('Watched', {
                        icon: 'check',
                        size: 'md',
                        pressed: true,
                      }),
                    }),
                  }),
                ],
              ]
                .map(
                  ([label, html]) =>
                    `<div>${g.label(label)}${g.spec(html)}</div>`,
                )
                .join('')}</div>` +
              `<div style="margin-top:12px">${g.label('Album on a phone · More is in the drawer bar')}${g.spec(
                fixed(
                  D.detailHead({
                    item: A[0],
                    kind: 'Album',
                    by: 'by <a href="#">Mira Kestrel</a>',
                    facts: ['2019', '11 tracks', '42:18'],
                    play: play('header'),
                    links: D.logoLinks(['spotify', 'lastfm', 'discogs']),
                  }),
                  335,
                ),
              )}</div>` +
              g.rules([
                '<b>Same order for every resource:</b> artwork, kind, title, creator, one line of facts, service logos, actions.',
                '<b>Title is 18px</b> in the drawer and 22px on the standalone page.',
                '<b>Play pair under the artwork,</b> exactly as wide as it, where the item can be played. Play is the labelled primary button and takes the room that Queue, a square icon button, leaves. An item without artwork starts its action row with the pair.',
                '<b>Service logos</b> sit on a line of their own under the facts: one link per service, each opening the item there in a new tab.',
                '<b>Action row:</b> the item’s own actions, such as Watched, Subscribed or Identify film, then More at the far end. A header with nothing else has just More.',
                '<b>On a phone</b> More is in the drawer bar, so a header with no other action has no action row.',
                '<b>Settings live in More</b> as a ticked group, such as a playlist’s type, never as a control in the header.',
                '<b>Side panels.</b> Filters and view, Add and Scrobble link use the same modal side panel as details: a panel on the right, or a sheet from the top edge on a phone, closed by its Close button, Escape or the backdrop.',
              ]) +
              g.note(
                'Replaces',
                'four title sizes (18, 20, 22 and 28px) and five artwork treatments.',
              ),
          },
          {
            id: 'shell',
            title: 'Rail and player dock',
            body:
              g.spec(
                `<div style="width:196px;background:var(--ds-page);padding:8px;border-radius:8px;display:grid;gap:2px">${D.libraryNav('Browse').map(D.navItem).join('')}${D.navItem({ label: 'Jobs', icon: 'activity', count: 3, tone: 'attention' })}${D.navItem({ label: 'Providers', icon: 'layers', count: 1, tone: 'danger' })}</div>`,
              ) +
              g.spec(
                `<div style="min-width:760px"><div style="background:var(--ds-page);padding:0 8px 8px 0;border-radius:12px">${D.dock()}</div><div class="g-cap">Playing</div><div style="background:var(--ds-page);padding:0 8px 8px 0;border-radius:12px;margin-top:12px">${D.dock({ needsDevice: true })}</div><div class="g-cap">No device: the message and its action are inside the dock</div></div>`,
                { style: 'overflow-x:auto' },
              ) +
              g.rules([
                '<b>Rail.</b> Jobs and Providers carry a count when something is running, waiting or failed, so their state is visible from every page. On a phone the count sits on the corner of the tab, and the Jobs count opens Activity above the tab bar.',
                '<b>Dock.</b> Messages about playback belong in the dock beside the device button. The floating banner above the dock, which covers the last row of every list, goes away.',
              ]),
          },
        ],
      })
    </script>
  </body>
</html>
