<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace tabs · Media Manager design library</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/tokens.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/components.css"
    />
    <link rel="stylesheet" href="assets/gallery.css" />
    <style>
      .sample {
        max-width: calc(var(--ds-inspector) + var(--ds-rail));
        background: var(--ds-surface);
        border-radius: var(--ds-r-lg);
        box-shadow: var(--ds-shadow-raise);
      }
      .tab-tools,
      .tab-list,
      .tab-item,
      .sample-head,
      .sample-title {
        display: flex;
        align-items: center;
      }
      .tab-tools,
      .sample-head {
        gap: var(--ds-3);
        padding: var(--ds-4) var(--ds-gutter);
      }
      .tab-tools {
        background: var(--ds-sunken);
        border-radius: var(--ds-r-lg) var(--ds-r-lg) 0 0;
      }
      .tab-list {
        min-width: 0;
        gap: var(--ds-2);
        overflow-x: auto;
        padding: var(--ds-2);
      }
      .tab-item {
        flex: none;
        border-radius: var(--ds-r-sm);
        background: var(--ds-chip);
      }
      .tab-item:has([aria-selected='true']) {
        background: var(--ds-surface);
        box-shadow: var(--ds-shadow-raise);
      }
      .tab-item [role='tab'] {
        max-width: var(--ds-rail);
      }
      .tab-item [data-close] {
        flex: none;
        color: var(--ds-ink-2);
      }
      .tab-tools > [data-new] {
        flex: none;
      }
      .sample-title {
        gap: var(--ds-3);
        margin: 0 auto 0 0;
        font-size: var(--ds-text-lg);
      }
      .sample-head .ds-search {
        flex: 0 1 auto;
        min-width: 0;
      }
      .sample-head .ds-search input {
        width: 100%;
      }
      .sample-stage {
        position: relative;
      }
      .sample-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .sample-view {
        max-height: calc(var(--ds-row-media) * 8);
        overflow: auto;
      }
      .sample-detail {
        padding: var(--ds-6);
      }
      .sample-drawer {
        position: absolute;
        inset: 0 0 0 auto;
        width: min(100%, var(--ds-inspector));
        z-index: 2;
      }
      .sample-drawer .ds-inspector-bar {
        justify-content: space-between;
      }
      .sample-empty {
        padding: var(--ds-gutter);
      }
      .sample [hidden] {
        display: none;
      }
      .feedback {
        position: absolute;
        width: var(--ds-1);
        height: var(--ds-1);
        clip-path: inset(50%);
        overflow: hidden;
      }
      @media (max-width: 700px) {
        .tab-list:has(> :nth-child(2):last-child) .tab-item {
          flex-shrink: 1;
          min-width: 0;
        }
        .tab-item [role='tab'] {
          min-width: 0;
        }
        .tab-item [role='tab'] > .ds-i {
          display: none;
        }
        .sample .ds-btn {
          min-height: var(--ds-h-touch);
        }
        .sample-head {
          flex-wrap: wrap;
        }
        .sample-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .sample .ds-btn[data-icon] {
          min-width: var(--ds-h-touch);
        }
        .sample-drawer {
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="ds g" data-page="concept-workspace-tabs.html">
    <script src="assets/ds.js"></script>
    <script>
      const { g, icon, esc } = DS
      const films = DS.data.FILMS.slice(0, 4)
      const modifier = /Mac|iPhone|iPad/.test(navigator.platform)
        ? 'Option'
        : 'Alt'
      const browserDesign = 'concept-browser-tabs.html'
      const filmHref = (film) =>
        browserDesign +
        '?film=' +
        encodeURIComponent(film.title.toLowerCase().replaceAll(' ', '-'))
      DS.page({
        title: 'Workspace tabs',
        lede: `Click a film to inspect it. <b>${modifier}-click</b> its title, artwork or Open page link to open it in a background workspace tab.`,
        sections: [
          {
            id: 'single',
            title: 'Film Browse',
            body:
              `<div class="sample" id="single-demo"><div class="tab-tools"><div class="tab-list" role="tablist" aria-label="Workspace tabs"></div><button type="button" class="ds-btn" data-icon data-variant="ghost" data-new aria-label="Duplicate current tab" title="Duplicate current tab">${icon('plus')}</button></div><div class="sample-panels"></div><div class="feedback" role="status"></div></div>` +
              g.rules([
                'Select <b>+</b> to duplicate the current view and switch to the copy. Try it after searching for a film or opening its inspector. Each copy can be changed independently.',
                'Use the <b>× beside a tab’s title</b> to close that tab. Closing the last tab takes you back to Films.',
                `With a destination focused, <b>${modifier} + Enter</b> also opens it in the background. In the tab bar, use the arrow keys to move, Enter to switch and Delete to close.`,
                'On touch screens, tap <b>+</b> and navigate in the copy. Swipe along the bar to reach more tabs.',
              ]),
          },
        ],
      })
      function filmDetails(film) {
        return (
          DS.detailHead({
            kind: 'Film',
            item: film,
            by: esc(film.by),
            facts: [film.year, film.runtime],
          }) +
          DS.section(
            'Ratings',
            DS.facts([
              ['IMDb', film.imdb],
              ['Metacritic', film.mc],
              ['Rotten Tomatoes', film.rt],
              ['Letterboxd', film.lb],
            ]),
          ) +
          DS.section('Tags', DS.pills(film.tags, { pill: { static: true } }))
        )
      }

      function filmCards() {
        return films
          .map((film, i) => {
            const destination = `href="${filmHref(film)}" data-destination="${i}" aria-keyshortcuts="Alt+Enter"`
            return `<article class="ds-card" data-card="${i}">
            <a ${destination} aria-label="Inspect ${esc(film.title)}">${DS.artBox(film)}</a>
            <a class="ds-card-title" ${destination}>${esc(film.title)}</a>
            <span class="ds-card-by">${esc(film.by)}</span><div class="ds-card-meta"><span>${film.year}</span><span>${film.runtime}</span></div>
          </article>`
          })
          .join('')
      }

      function workspace(root) {
        const strip = root.querySelector('.tab-list')
        const panels = root.querySelector('.sample-panels')
        const status = root.querySelector('[role="status"]')
        const tabs = []
        let active
        let serial = 0
        const title = (tab) =>
          tab.film
            ? tab.film.title
            : tab.query
              ? 'Films · ' + tab.query
              : 'Films'
        const findTab = (id) => tabs.find((tab) => tab.id === id)

        function drawTools() {
          strip.innerHTML = tabs
            .map((tab) => {
              const selected = tab === active
              const label = esc(title(tab))
              return `<span class="tab-item" role="presentation">
              <button type="button" class="ds-btn" data-variant="ghost" role="tab" id="${tab.id}-label" aria-controls="${tab.id}" aria-selected="${selected}" tabindex="${selected ? 0 : -1}" data-select="${tab.id}" title="${label}">${icon(tab.film ? 'film' : 'grid')}<span class="ds-truncate">${label}</span></button>
              <button type="button" class="ds-btn" data-size="xs" data-icon data-variant="ghost" tabindex="${selected ? 0 : -1}" data-close="${tab.id}" aria-label="Close ${label} tab" title="Close ${label} tab">${icon('x', { size: 'sm' })}</button></span>`
            })
            .join('')
          for (const tab of tabs) tab.panel.hidden = tab !== active
        }

        function focusActive() {
          const selected = strip.querySelector('[aria-selected="true"]')
          selected.focus()
          selected.parentElement.scrollIntoView({
            inline: 'nearest',
            block: 'nearest',
          })
        }

        function renderPage(panel, film) {
          const content = film
            ? '<div class="sample-detail">' + filmDetails(film) + '</div>'
            : `<header class="sample-head"><h3 class="sample-title">${icon('grid', { size: 'sm' })}Films</h3><label class="ds-search">${icon('search')}<input type="search" placeholder="Search films" aria-label="Search films"></label></header>
               <div class="ds-grid sample-grid">${filmCards()}</div><p class="sample-empty" hidden>No films match this search.</p>`
          panel.innerHTML = '<div class="sample-view">' + content + '</div>'
        }

        function addTab(film, foreground, source) {
          // Each specimen is a self-contained DOM view. Its inputs, hidden cards
          // and open inspector can be cloned together without sharing listeners.
          const offsets = source
            ? Array.from(
                source.panel.querySelectorAll(
                  '.sample-view, .ds-inspector-body',
                ),
                (el) => el.scrollTop,
              )
            : []
          const panel = source
            ? source.panel.cloneNode(true)
            : document.createElement('div')
          panel.id = root.id + '-panel-' + ++serial
          panel.className = 'sample-stage'
          panel.setAttribute('role', 'tabpanel')
          panel.setAttribute('aria-labelledby', panel.id + '-label')
          panel.tabIndex = 0
          if (!source) renderPage(panel, film)
          panels.append(panel)
          const tab = { panel, id: panel.id, film, query: source?.query ?? '' }
          tabs.push(tab)
          if (foreground) active = tab
          drawTools()
          if (source) {
            panel
              .querySelectorAll('.sample-view, .ds-inspector-body')
              .forEach((el, i) => {
                el.scrollTop = offsets[i]
              })
          }
        }

        function openFilm(i) {
          const film = films[i]
          if (!film) return
          addTab(film, false)
          status.textContent =
            film.title +
            ' opened in a workspace tab. ' +
            tabs.length +
            ' tabs open.'
        }

        function dismissDrawer(drawer) {
          const origin = drawer.parentElement.querySelector('[data-origin]')
          origin?.removeAttribute('data-origin')
          for (const sibling of drawer.parentElement.children)
            sibling.inert = false
          drawer.remove()
          origin?.focus()
        }

        function inspect(i, origin) {
          const film = films[i]
          if (!film) return
          for (const child of active.panel.children) child.inert = true
          const drawer = document.createElement('aside')
          drawer.className = 'ds-inspector sample-drawer'
          origin.setAttribute('data-origin', '')
          drawer.setAttribute('role', 'dialog')
          drawer.setAttribute('aria-label', film.title)
          drawer.innerHTML = `<div class="ds-inspector-bar"><div class="ds-crumbs">Films ${icon('chevR')}<b>${esc(film.title)}</b></div>
            <a class="ds-btn" href="${filmHref(film)}" data-page-link data-destination="${i}" aria-keyshortcuts="Alt+Enter">${icon('expand')}Open page</a>
            <button type="button" class="ds-btn" data-icon data-variant="ghost" data-dismiss aria-label="Close inspector">${icon('x')}</button></div>
            <div class="ds-inspector-body">${filmDetails(film)}</div>`
          active.panel.append(drawer)
          drawer.querySelector('[data-dismiss]').focus()
        }

        function closeTab(tab) {
          const index = tabs.indexOf(tab)
          tabs.splice(index, 1)
          tab.panel.remove()
          if (!tabs.length) addTab(null, true)
          else {
            if (tab === active) active = tabs[Math.min(index, tabs.length - 1)]
            drawTools()
          }
          focusActive()
          status.textContent = title(tab) + ' tab closed.'
        }

        root.addEventListener('input', (event) => {
          if (!event.target.matches('input[type="search"]')) return
          active.query = event.target.value
          const query = active.query.trim().toLowerCase()
          let found = false
          for (const card of active.panel.querySelectorAll('[data-card]')) {
            const film = films[Number(card.dataset.card)]
            card.hidden = ![film.title, film.by].some((field) =>
              field.toLowerCase().includes(query),
            )
            if (!card.hidden) found = true
          }
          active.panel.querySelector('.sample-empty').hidden = found
          drawTools()
        })

        root.addEventListener('click', (event) => {
          const button = event.target.closest('a,button')
          if (!button || event.defaultPrevented || event.button !== 0) return
          if (button.hasAttribute('data-new')) {
            addTab(active.film, true, active)
            focusActive()
            status.textContent = 'Current tab duplicated.'
          }
          if (button.hasAttribute('data-select')) {
            active = findTab(button.dataset.select)
            drawTools()
            focusActive()
          }
          if (button.hasAttribute('data-close'))
            closeTab(findTab(button.dataset.close))
          if (button.hasAttribute('data-dismiss'))
            dismissDrawer(button.closest('aside'))
          if (
            button.hasAttribute('data-destination') &&
            !event.metaKey &&
            !event.ctrlKey &&
            !event.shiftKey
          ) {
            event.preventDefault()
            const i = Number(button.dataset.destination)
            if (event.altKey) openFilm(i)
            else if (button.hasAttribute('data-page-link')) {
              active.film = films[i]
              active.query = ''
              renderPage(active.panel, active.film)
              drawTools()
              active.panel.focus()
            } else inspect(i, button)
          }
        })

        root.addEventListener('keydown', (event) => {
          const destination = event.target.closest('[data-destination]')
          if (
            event.key === 'Enter' &&
            event.altKey &&
            !event.ctrlKey &&
            !event.metaKey &&
            !event.shiftKey &&
            destination
          ) {
            event.preventDefault()
            if (!event.repeat) openFilm(Number(destination.dataset.destination))
            return
          }
          if (event.key === 'Escape') {
            const drawer = event.target.closest('.sample-drawer')
            if (drawer) dismissDrawer(drawer)
            return
          }
          const tab = event.target.closest('[role="tab"]')
          if (!tab) return
          const position = tabs.indexOf(findTab(tab.dataset.select))
          const keys = {
            ArrowLeft: (position - 1 + tabs.length) % tabs.length,
            ArrowRight: (position + 1) % tabs.length,
            Home: 0,
            End: tabs.length - 1,
          }
          if (Object.hasOwn(keys, event.key)) {
            event.preventDefault()
            strip.querySelectorAll('[role="tab"]')[keys[event.key]].focus()
          }
          if (event.key === 'Delete') {
            event.preventDefault()
            closeTab(tabs[position])
          }
        })
        addTab(null, true)
      }

      workspace(document.querySelector('#single-demo'))
    </script>
  </body>
</html>
