<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concept: library merge · Media Manager design library</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/tokens.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/components.css"
    />
    <link rel="stylesheet" href="assets/gallery.css" />
    <link rel="stylesheet" href="../../packages/ui/src/styles/detail.css" />
    <!--
      Styles for the concept while it is a concept. Tokens only. The accepted
      parts move to components.css.
    -->
    <style>
      .g-main {
        min-width: 0;
      }
      /* Controls of this page, not of the app */
      .mc-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--ds-5) var(--ds-8);
        margin-bottom: var(--ds-5);
      }
      .mc-controls .ds-seg {
        flex-wrap: wrap;
      }
      /* What a record is made of: names, the record, versions */
      .mc-figure {
        display: grid;
        grid-template-columns:
          minmax(0, 1fr) auto minmax(0, 0.8fr) auto
          minmax(0, 1fr);
        align-items: center;
        gap: var(--ds-5);
      }
      .mc-figure .ds-row {
        padding-inline: 0;
      }
      .mc-figure .ds-row:last-child {
        border-bottom: 0;
      }
      .mc-figure-arrow {
        color: var(--ds-ink-4);
      }
      @media (max-width: 700px) {
        .mc-figure {
          grid-template-columns: minmax(0, 1fr);
        }
        .mc-figure-arrow {
          justify-self: center;
          rotate: 90deg;
        }
      }
      /* The tables keep their identity column readable when the page is narrow */
      .mc-wide .ds-table {
        min-width: calc(var(--ds-inspector) + var(--ds-rail) * 2);
      }
      .mc-narrow .ds-table {
        min-width: var(--ds-inspector);
      }
      .mc-mid .ds-table {
        min-width: calc(var(--ds-inspector) * 1.2);
      }
      .mc-scroll {
        max-height: calc(var(--ds-row) * 15 + var(--ds-head));
      }
      /* The space a chevron takes on rows with nothing to show */
      .mc-slot {
        flex: none;
        width: var(--ds-h-xs);
      }
      .ds-cell-id > .ds-btn {
        flex: none;
      }
      /* Proposed: a part of a record, under its row */
      .mc-part {
        padding-left: calc(var(--ds-h-xs) + var(--ds-4));
        color: var(--ds-ink-2);
      }
      /* Proposed: a group row that carries actions */
      .mc-group {
        display: inline-flex;
        align-items: center;
        gap: var(--ds-4);
      }
      .mc-group .ds-btn:not([data-variant]) {
        background: var(--ds-surface);
      }
      .mc-inspector {
        max-width: calc(var(--ds-inspector) * 1.3);
        --g-h: calc(var(--ds-9) * 20);
      }
      .mc-inspector .ds-selectbar {
        position: sticky;
        bottom: 0;
        z-index: 4;
      }
      .mc-stack {
        display: grid;
        gap: var(--ds-4);
      }
      .mc-result {
        display: inline-flex;
        align-items: center;
        gap: var(--ds-3);
        min-width: 0;
      }
      .mc-result > span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dtl-dialog-body .ds-kv dd {
        min-width: 0;
      }
      .dtl-dialog-body .ds-select {
        width: 100%;
      }
      .mc-dialog-actions {
        justify-content: end;
        flex-wrap: wrap;
      }
      .mc-timeline li {
        padding-block: var(--ds-2);
      }
      /* Phone: the change takes its own line under the date and the button */
      @media (max-width: 700px) {
        .mc-timeline li {
          grid-template-columns: auto minmax(0, 1fr) auto;
        }
        .mc-timeline li > .ds-truncate {
          grid-column: 1 / -1;
          grid-row: 2;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body class="ds g" data-page="concept-library-merge.html">
    <script src="assets/ds.js"></script>
    <script src="assets/merge-concept.js"></script>
    <script>
      const D = DS
      const { g, btn, icon, esc } = D
      const model = MergeConcept.create()

      const KINDS = ['track', 'album', 'artist']
      const KIND_LABEL = { track: 'Tracks', album: 'Albums', artist: 'Artists' }
      const KIND_NAME = { track: 'Track', album: 'Album', artist: 'Artist' }
      const MODES = ['once', 'review', 'unsure']
      const MODE_LABEL = [
        'A · At once',
        'B · Always review',
        'C · Review when unsure',
      ]

      const ui = {
        kind: 'track',
        mode: 'unsure',
        grouped: false,
        open: new Set(),
        selected: { main: new Set(), album: new Set() },
        result: { main: null, album: null, detail: null },
        detail: 't-route',
        history: 'all',
      }
      let dialogState = null

      /* A button that carries an action for the one click handler below */
      const act = (label, action, arg, o = {}) =>
        btn(label, o).replace(
          '<button type="button"',
          `<button type="button" data-act="${esc(action)}"${arg === undefined ? '' : ` data-arg="${esc(arg)}"`}`,
        )
      const partType = (p) =>
        p.type === 'name'
          ? 'Scrobbled name'
          : p.kind === 'artist'
            ? 'Profile'
            : 'Version'
      const partMark = (p) =>
        D.mark(p.type === 'name' ? 'lastfm' : 'spotify', { hidden: true })
      const count = (n) => Number(n).toLocaleString('en')

      /* Tables: the one table's markup, with part rows and group rows */

      const cellAttrs = (c) =>
        `${c.end ? ' data-align="end"' : ''}${
          c.sticky === undefined
            ? ''
            : ` data-sticky="${c.edge ? 'edge' : ''}" style="${c.w ? `width:${c.w}px;` : ''}--ds-sticky-left:${c.sticky}px"`
        }`
      const headCell = (c) =>
        `<th${cellAttrs(c)}${c.sticky === undefined && c.w ? ` style="width:${c.w}px"` : ''}>${c.h}</th>`
      const tableHtml = (cols, body, label, cls = 'mc-wide') =>
        `<div class="ds-table-wrap ${cls}"><table class="ds-table" data-layout="fixed" aria-label="${esc(label)}"><thead><tr>${cols.map(headCell).join('')}</tr></thead><tbody>${body}</tbody></table></div>`

      const checkCol = (ctx) => ({
        h: `<input type="checkbox" class="ds-check" data-all="${ctx}" aria-label="Select all" />`,
        w: 36,
        sticky: 0,
        c: (r) =>
          `<input type="checkbox" class="ds-check" data-select="${esc(r.id)}" data-ctx="${ctx}" aria-label="Select ${esc(r.title)}, ${esc(model.madeOf(r))}"${ui.selected[ctx].has(r.id) ? ' checked' : ''} />`,
        p: () => '',
      })

      const idCell = (r, o = {}) => {
        const open = ui.open.has(r.id)
        const toggle =
          o.expand === false
            ? ''
            : r.parts.length > 1
              ? act('', 'toggle', r.id, {
                  icon: open ? 'chevD' : 'chevR',
                  variant: 'ghost',
                  size: 'xs',
                  aria: `${open ? 'Hide' : 'Show'} what ${r.title} is made of`,
                })
              : '<span class="mc-slot"></span>'
        const playable = r.kind !== 'artist' && r.versions.length
        return `<span class="ds-cell-id">${toggle}${o.thumb === false ? '' : D.thumb(r)}<a class="ds-cell-title" href="#" data-act="open" data-arg="${esc(r.id)}">${esc(r.title)}</a>${playable ? D.play('row') : ''}</span>`
      }
      const partCell = (p) =>
        `<span class="ds-cell-id mc-part">${partMark(p)}<span class="ds-truncate">${esc(p.title)}</span></span>`
      const separateBtn = (ctx) => (p, r) =>
        r.parts.length > 1
          ? act('Separate', 'separate', `${ctx}:${p.id}`, {
              size: 'xs',
              variant: 'ghost',
            })
          : ''
      const madeOfCols = (ctx) => [
        {
          h: 'Made of',
          w: 140,
          c: (r) => model.madeOf(r),
          p: (p, r) => `${partType(p)}${r.lead.id === p.id ? ' · shown' : ''}`,
        },
        { h: '', w: 100, end: true, c: () => '', p: separateBtn(ctx) },
      ]
      const playsCol = {
        h: 'Scrobbles',
        w: 84,
        end: true,
        c: (r) => count(r.plays),
        p: (p) => (p.type === 'name' ? count(p.plays) : D.EMPTY),
      }

      const COLS = {
        track: [
          checkCol('main'),
          {
            h: 'Track',
            sticky: 36,
            edge: true,
            c: (r) => idCell(r),
            p: partCell,
          },
          {
            h: 'Artist',
            w: 140,
            c: (r) => esc(r.by),
            p: (p) => esc(p.by),
          },
          {
            h: 'Album',
            w: 170,
            c: (r) => esc(r.album),
            p: (p) => esc(p.album),
          },
          {
            h: 'Length',
            w: 64,
            end: true,
            c: (r) => r.duration || D.EMPTY,
            p: (p) => p.duration || D.EMPTY,
          },
          playsCol,
          ...madeOfCols('main'),
        ],
        album: [
          checkCol('main'),
          {
            h: 'Album',
            sticky: 36,
            edge: true,
            c: (r) => idCell(r),
            p: partCell,
          },
          {
            h: 'Artist',
            w: 150,
            c: (r) => esc(r.by),
            p: (p) => esc(p.by),
          },
          {
            h: 'Release',
            w: 140,
            c: (r) => (r.detail ? esc(r.detail) : D.EMPTY),
            p: (p) => (p.detail ? esc(p.detail) : D.EMPTY),
          },
          playsCol,
          ...madeOfCols('main'),
        ],
        artist: [
          checkCol('main'),
          {
            h: 'Artist',
            sticky: 36,
            edge: true,
            c: (r) => idCell(r),
            p: partCell,
          },
          {
            h: 'In the library',
            w: 170,
            c: (r) => (r.detail ? esc(r.detail) : D.EMPTY),
            p: (p) => (p.detail ? esc(p.detail) : D.EMPTY),
          },
          playsCol,
          ...madeOfCols('main'),
        ],
      }

      const recordRows = (cols, list, ctx, o = {}) =>
        list
          .map((r) => {
            const row = `<tr data-id="${esc(r.id)}" aria-selected="${ui.selected[ctx].has(r.id)}">${cols.map((c) => `<td${cellAttrs(c)}>${c.c(r)}</td>`).join('')}</tr>`
            const partsOpen = o.parts !== false && ui.open.has(r.id)
            return (
              row +
              (partsOpen
                ? r.parts
                    .map(
                      (p) =>
                        `<tr data-part>${cols.map((c) => `<td${cellAttrs(c)}>${c.p(p, r)}</td>`).join('')}</tr>`,
                    )
                    .join('')
                : '')
            )
          })
          .join('')

      const groupRow = (cols, ctx, s) =>
        `<tr data-group><td colspan="${cols.length}"><span class="mc-group">${act('Merge', 'merge-suggestion', `${ctx}:${s.id}`, { size: 'xs' })}${act('Keep separate', 'keep', `${ctx}:${s.id}`, { size: 'xs', variant: 'ghost' })}<span>${esc(s.evidence.join(' · '))}</span></span></td></tr>`

      /* The selection bar: a selection, or the result of the last change */
      function barHtml(ctx, total) {
        const selected = ui.selected[ctx]
        if (selected.size) {
          const action =
            selected.size === 1
              ? act('Merge with…', 'merge-with', ctx, { variant: 'primary' })
              : act(ui.mode === 'review' ? 'Merge…' : 'Merge', 'merge', ctx, {
                  variant: 'primary',
                })
          return `<span><b>${selected.size} selected</b> <span class="ds-muted">of ${total}</span></span><span class="ds-actions ds-toolbar-end">${action}${act('', 'clear', ctx, { icon: 'x', aria: 'Clear selection' })}</span>`
        }
        const result = resultOf(ctx)
        if (!result) return ''
        return `<span class="mc-result" role="status">${icon(result.icon, { size: 'sm' })}<span>${esc(result.text)}</span></span><span class="ds-actions ds-toolbar-end">${undoBtn(result.entry, {})}${act('', 'dismiss', ctx, { icon: 'x', aria: 'Dismiss' })}</span>`
      }

      /* The first suggestion for the open record; the next one follows it */
      function suggestionNotices(ctx, recordId) {
        const pending = model.suggestionsFor(recordId)
        if (!pending.length) return ''
        const s = pending[0]
        const others = s.records
          .filter((r) => r.id !== recordId)
          .map((r) => `“${r.title}”${r.by ? ` by ${r.by}` : ''}`)
        const position = pending.length > 1 ? ` 1 of ${pending.length}` : ''
        return D.notice(
          `Possible duplicate${position}: ${esc(others.join(', '))}. ${esc(s.evidence.join(' · '))}`,
          {
            action: `<span class="ds-actions">${act('Merge', 'merge-suggestion', `${ctx}:${s.id}`, { size: 'xs' })}${act('Keep separate', 'keep', `${ctx}:${s.id}`, { size: 'xs', variant: 'ghost' })}</span>`,
          },
        )
      }

      /* Sections */

      function renderMain() {
        const kind = ui.kind
        const cols = COLS[kind]
        const all = model.records(kind)
        const pending = model.suggestions(kind)
        let body
        let shown = all
        if (ui.grouped) {
          shown = []
          body = pending
            .map((s) => {
              shown.push(...s.records)
              return (
                groupRow(cols, 'main', s) + recordRows(cols, s.records, 'main')
              )
            })
            .join('')
          if (!pending.length)
            body = `<tr><td colspan="${cols.length}">${D.state('No possible duplicates', `Nothing among these ${KIND_LABEL[kind].toLowerCase()} looks like the same ${KIND_NAME[kind].toLowerCase()} twice.`, { size: 'sm' })}</td></tr>`
        } else body = recordRows(cols, all, 'main')
        const toggle = act('Possible duplicates', 'grouped', undefined, {
          icon: 'layers',
          pressed: ui.grouped,
        }).replace('</button>', `${D.count(pending.length)}</button>`)
        document.getElementById('mc-main').innerHTML =
          `<div class="ds-toolbar">${D.search(`Search ${KIND_LABEL[kind].toLowerCase()}`, { ai: false })}${toggle}<span class="ds-toolbar-count">${shown.length} ${shown.length === 1 ? KIND_NAME[kind].toLowerCase() : KIND_LABEL[kind].toLowerCase()}</span></div>` +
          tableHtml(cols, body, KIND_LABEL[kind], 'mc-wide mc-scroll') +
          `<div class="ds-selectbar">${barHtml('main', shown.length)}</div>`
        syncHeaderCheck('main', shown)
      }

      const ALBUM_COLS = [
        checkCol('album'),
        {
          h: '#',
          w: 40,
          end: true,
          c: (r) =>
            r.versions.length
              ? `<span class="ds-muted">${r.versions[0].n}</span>`
              : '',
          p: () => '',
        },
        {
          h: 'Title',
          c: (r) => idCell(r, { expand: false, thumb: false }),
          p: partCell,
        },
        {
          h: 'Length',
          w: 64,
          end: true,
          c: (r) => r.duration || D.EMPTY,
          p: () => '',
        },
        playsCol,
        { h: 'Made of', w: 150, c: (r) => model.madeOf(r), p: () => '' },
      ]

      function renderAlbum() {
        const id = model.recordOf('b-harbour')
        const album = model.view(id)
        const { listed, loose } = model.albumTracks(id)
        const rows = [...listed, ...loose]
        const body =
          recordRows(ALBUM_COLS, listed, 'album', { parts: false }) +
          (loose.length
            ? `<tr data-group><td colspan="${ALBUM_COLS.length}">Scrobbled under this album, not on its track list</td></tr>` +
              recordRows(ALBUM_COLS, loose, 'album', { parts: false })
            : '')
        document.getElementById('mc-album').innerHTML = D.inspector({
          crumbs: ['Albums', album.title],
          head: D.detailHead({
            item: album,
            kind: 'Album',
            title: album.title,
            by: D.link(album.by),
            facts: [
              esc(album.detail || ''),
              `${count(album.plays)} scrobbles`,
              esc(model.madeOf(album)),
            ],
            play: D.play('header'),
          }),
          tabs: ['Overview', ['Tracks', listed.length], 'Listening', 'Sources'],
          tab: 1,
          body:
            `<div class="mc-stack">${suggestionNotices('album', id)}</div>` +
            tableHtml(
              ALBUM_COLS,
              body,
              `Tracks of ${album.title}`,
              'mc-narrow',
            ) +
            `<div class="ds-selectbar">${barHtml('album', rows.length)}</div>`,
        })
        syncHeaderCheck('album', rows)
      }

      function renderDetail() {
        if (!model.view(ui.detail)) ui.detail = model.recordOf('t-route')
        const r = model.view(ui.detail)
        const cols = [
          { h: 'Part', c: (p) => partCell(p).replace(' mc-part', '') },
          { h: 'Type', w: 120, c: partType },
          ...(r.kind === 'track'
            ? [{ h: 'Album', w: 150, c: (p) => esc(p.album) }]
            : []),
          {
            h: 'Scrobbles',
            w: 84,
            end: true,
            c: (p) => (p.type === 'name' ? count(p.plays) : D.EMPTY),
          },
          {
            h: 'Shown',
            w: 60,
            c: (p) =>
              `<input type="radio" class="ds-check" name="mc-lead" data-lead="${esc(p.id)}" aria-label="Show ${esc(p.title)} first"${r.lead.id === p.id ? ' checked' : ''} />`,
          },
          {
            h: '',
            w: 100,
            end: true,
            c: (p) => separateBtn('detail')(p, r),
          },
        ]
        const body = r.parts
          .map(
            (p) =>
              `<tr>${cols.map((c) => `<td${cellAttrs(c)}>${c.c(p)}</td>`).join('')}</tr>`,
          )
          .join('')
        const changes = model.changesTo(r.id)
        const result = resultOf('detail')
        const facts =
          r.kind === 'track'
            ? [esc(r.album), r.duration || '', `${count(r.plays)} scrobbles`]
            : [esc(r.detail || 'Last.fm only'), `${count(r.plays)} scrobbles`]
        document.getElementById('mc-detail').innerHTML = D.inspector({
          crumbs: [KIND_LABEL[r.kind], r.title],
          head: D.detailHead({
            item: r,
            kind: KIND_NAME[r.kind],
            title: r.title,
            by: r.by ? D.link(r.by) : '',
            facts: facts.filter(Boolean),
            play: r.kind === 'artist' ? undefined : D.play('header'),
          }),
          tabs: ['Overview', 'Listening', 'Playlists', 'Sources'],
          tab: 3,
          body:
            `<div class="mc-stack">${
              result
                ? D.notice(esc(result.text), {
                    icon: result.icon,
                    action: undoBtn(result.entry),
                  })
                : ''
            }${suggestionNotices('detail', r.id)}</div>` +
            D.section(
              'Made of',
              tableHtml(cols, body, `Parts of ${r.title}`, 'mc-mid'),
              {
                note: esc(model.madeOf(r)),
                aside: act('Merge with…', 'merge-with', 'detail', {
                  size: 'xs',
                }),
              },
            ) +
            D.section(
              'Changes',
              changes.length
                ? `<ol class="ds-timeline mc-timeline">${changes.map(timelineItem).join('')}</ol>`
                : D.state(
                    'No changes',
                    'Nothing has been merged into or separated from this record.',
                    { size: 'sm' },
                  ),
            ),
        })
        const select = document.getElementById('mc-record')
        const merged = KINDS.flatMap((kind) =>
          model.records(kind).filter((x) => x.parts.length > 1),
        )
        const options = merged.some((x) => x.id === r.id)
          ? merged
          : [r, ...merged]
        select.innerHTML = options
          .map(
            (x) =>
              `<option value="${esc(x.id)}"${x.id === r.id ? ' selected' : ''}>${esc(KIND_NAME[x.kind])} · ${esc(x.title)}${x.by ? ` · ${esc(x.by)}` : ''} (${esc(model.madeOf(x))})</option>`,
          )
          .join('')
      }

      const whoStatus = (j) =>
        j.undone
          ? D.status('cancelled', 'Undone')
          : D.status('done', j.by === 'You' ? 'You' : 'Automatic')
      const MOVED_SINCE =
        'A later change moved these parts. Undo that change first.'
      const movedSince = (j) =>
        !(j.undone ? model.canRedo(j) : model.canUndo(j))
      const undoBtn = (j, o = { size: 'xs' }) =>
        act(j.undone ? 'Redo' : 'Undo', j.undone ? 'redo' : 'undo', j.id, {
          ...o,
          variant: j.undone ? 'ghost' : undefined,
          disabled: movedSince(j),
          title: movedSince(j) ? MOVED_SINCE : undefined,
        })
      /* The last change made in a section, read from its journal entry */
      function resultOf(ctx) {
        const result = ui.result[ctx]
        const entry =
          result && model.journal().find((j) => j.id === result.entry)
        if (!entry) return null
        return {
          entry,
          icon: entry.undone ? 'history' : 'check',
          text: `${entry.undone ? 'Undone: ' : ''}${result.text}`,
        }
      }
      const timelineItem = (j) =>
        `<li><span class="ds-muted ds-num">${esc(j.at)}</span>${whoStatus(j)}<span class="ds-truncate" title="${esc(j.text)}">${esc(j.text)}</span>${undoBtn(j)}</li>`

      function renderHistory() {
        const filter = ui.history
        const list = model
          .journal()
          .filter(
            (j) =>
              filter === 'all' ||
              (filter === 'you' ? j.by === 'You' : j.by !== 'You'),
          )
        const cols = [
          {
            h: 'When',
            w: 148,
            c: (j) => `<span class="ds-num">${esc(j.at)}</span>`,
          },
          {
            h: 'Change',
            c: (j) => {
              const sub = [
                j.rule,
                j.also?.length ? `Also merged ${j.also.join('; ')}` : '',
                j.blocked ? 'Will not be merged automatically again' : '',
                movedSince(j) ? MOVED_SINCE.replace(/\.$/, '') : '',
              ].filter(Boolean)
              return `<span class="ds-cell-two"><span class="ds-cell-title" title="${esc(j.text)}">${esc(j.text)}</span><span class="ds-cell-sub" title="${esc(sub.join('. '))}">${sub.length ? esc(sub.join('. ')) : '&nbsp;'}</span></span>`
            },
          },
          { h: 'By', w: 104, c: whoStatus },
          { h: 'In', w: 76, c: (j) => KIND_LABEL[j.kind] },
          {
            h: 'Scrobbles moved',
            w: 124,
            end: true,
            c: (j) => (j.plays ? count(j.plays) : D.EMPTY),
          },

      function syncHeaderCheck(ctx, rows) {
        const all = document.querySelector(`input[data-all="${ctx}"]`)
        if (!all) return
        const picked = rows.filter((r) => ui.selected[ctx].has(r.id)).length
        all.checked = rows.length > 0 && picked === rows.length
        all.indeterminate = picked > 0 && picked < rows.length
      }

      /* Scroll areas are redrawn with their sections; keep their positions */
      const SCROLLERS = [
        '#mc-main .ds-table-wrap',
        '#mc-album .ds-inspector-body',
        '#mc-detail .ds-inspector-body',
      ]

      function render() {
        for (const ctx of ['main', 'album'])
          for (const id of [...ui.selected[ctx]])
            if (!model.view(id)) ui.selected[ctx].delete(id)
        const tops = SCROLLERS.map(
          (selector) => document.querySelector(selector)?.scrollTop ?? 0,
        )
        renderMain()
        renderAlbum()
        renderDetail()
        renderHistory()
        SCROLLERS.forEach((selector, i) => {
          const area = document.querySelector(selector)
          if (area) area.scrollTop = tops[i]
        })
        for (const control of document.querySelectorAll('.ds-play button')) {
          control.disabled = true
          control.title = 'Playback is unavailable for sample tracks'
        }
        for (const control of document.querySelectorAll(
          '.ds-detail-play .ds-btn',
        )) {
          control.disabled = true
          control.title = 'Playback is unavailable for sample tracks'
        }
      }

      /* Merging */

      const resultText = (entry) => {
        const bits = [entry.text]
        if (entry.plays) bits.push(`${count(entry.plays)} scrobbles moved`)
        return `${bits.join(' · ')}.${entry.also?.length ? ` Also merged ${entry.also.join('; ')}.` : ''}`
      }
      function report(ctx, entry) {
        ui.result[ctx] = { entry: entry.id, text: resultText(entry) }
      }

      function requestMerge(ids, ctx) {
        const p = model.plan(ids)
        const review =
          ui.mode === 'review' || (ui.mode === 'unsure' && p.cautions.length)
        if (review) openDialog({ mode: 'review', ids, ctx, follow: true })
        else commit(ids, ctx, {})
      }

      function commit(ids, ctx, o) {
        const entry = model.merge(ids, o)
        ui.selected[ctx]?.clear()
        report(ctx, entry)
        if (ctx !== 'album') ui.detail = entry.target
        render()
      }

      /* The dialog: review a merge, or pick the record to merge with */

      function openDialog(next) {
        dialogState = next
        renderDialog()
        const dialog = document.getElementById('mc-dialog')

          .querySelector(
            next.mode === 'pick' ? 'input' : '[data-act="confirm"]',

          ?.focus()
      }

      function pickList() {

        const q = s.query.trim().toLowerCase()
        const list = model
          .records(origin.kind)
          .filter((r) => r.id !== origin.id)
          .filter(
            (r) =>
              !q ||
              [r.title, r.by, r.album].some((v) =>
                (v || '').toLowerCase().includes(q),

          .sort((a, b) => Number(mates.has(b.id)) - Number(mates.has(a.id)))
          .slice(0, 8)
        const cols = [
          {
            h: KIND_NAME[origin.kind],

      /* One handler for every control */

      const split = (arg) => {
        const at = arg.indexOf(':')
        return [arg.slice(0, at), arg.slice(at + 1)]
      }
      const ACTIONS = {
        toggle: (id) => {
          if (!ui.open.delete(id)) ui.open.add(id)
        },
        open: (id) => {
          ui.detail = id
          ui.result.detail = null
          document
            .getElementById('made-of')
            .scrollIntoView({ behavior: 'smooth', block: 'start' })
        },
        grouped: () => {
          ui.grouped = !ui.grouped
          ui.selected.main.clear()
        },
        clear: (ctx) => ui.selected[ctx].clear(),
        dismiss: (ctx) => {
          ui.result[ctx] = null
        },
        merge: (ctx) => requestMerge([...ui.selected[ctx]], ctx),
        'merge-with': (ctx) =>
          openDialog({
            mode: 'pick',
            ids: ctx === 'detail' ? [ui.detail] : [...ui.selected[ctx]],
            ctx,
            follow: true,
          }),
        'merge-suggestion': (arg) => {
          const [ctx, id] = split(arg)
          const kinds = KINDS.flatMap((kind) => model.suggestions(kind))
          const s = kinds.find((x) => x.id === id)
          if (s)
            requestMerge(
              s.records.map((r) => r.id),
              ctx,
            )
        },
        keep: (arg) => {
          const [ctx, id] = split(arg)
          report(ctx, model.keepSeparate(id))
        },
        separate: (arg) => {
          const [ctx, id] = split(arg)
          report(ctx, model.separate(id))
        },
        undo: (id) => model.undo(id),
        redo: (id) => model.redo(id),
        cancel: () => document.getElementById('mc-dialog').close(),
        choose: (id) => {
          const p = model.plan([dialogState.ids[0], id])
          const ids = [dialogState.ids[0], id]
          const review =
            ui.mode === 'review' || (ui.mode === 'unsure' && p.cautions.length)
          if (review) {
            openDialog({ ...dialogState, mode: 'review', ids })
            return false
          }
          document.getElementById('mc-dialog').close()
          commit(ids, dialogState.ctx, {})
          return false
        },
        confirm: () => {
          const s = dialogState
          document.getElementById('mc-dialog').close()
          commit(s.ids, s.ctx, { follow: s.follow, lead: s.lead })
          return false
        },
      }

      document.body.addEventListener('click', (event) => {
        const control = event.target.closest('[data-act]')
        if (control) {
          event.preventDefault()
          const again = ACTIONS[control.dataset.act](control.dataset.arg)
          if (again !== false) render()
          return
        }
        const option = event.target.closest(
          '#mc-kind button, #mc-mode button, #mc-history-filter button',
        )
        if (!option) return
        const index = [...option.parentElement.children].indexOf(option)
        if (option.parentElement.id === 'mc-kind') {
          ui.kind = KINDS[index]
          ui.selected.main.clear()
          ui.result.main = null
        } else if (option.parentElement.id === 'mc-mode') ui.mode = MODES[index]
        else ui.history = ['all', 'you', 'auto'][index]
        render()
      })

      document.body.addEventListener('change', (event) => {
        const target = event.target
        if (target.dataset.select) {
          const set = ui.selected[target.dataset.ctx]
          if (target.checked) set.add(target.dataset.select)
          else set.delete(target.dataset.select)
          ui.result[target.dataset.ctx] = null
        } else if (target.dataset.all) {
          const ctx = target.dataset.all
          const ids = [
            ...target.closest('table').querySelectorAll('input[data-select]'),
          ].map((box) => box.dataset.select)
          ui.selected[ctx] = new Set(target.checked ? ids : [])
          ui.result[ctx] = null
        } else if (target.dataset.lead)
          model.setLead(ui.detail, target.dataset.lead)
        else if (target.id === 'mc-record') {
          ui.detail = target.value
          ui.result.detail = null
        } else if (target.id === 'mc-follow') {
          dialogState.follow = target.checked
          renderDialog()
          return
        } else if (target.id === 'mc-lead-pick') {
          dialogState.lead = target.value
          renderDialog()
          return
        } else return
        render()
      })

      document.body.addEventListener('input', (event) => {
        if (event.target.id !== 'mc-query') return
        dialogState.query = event.target.value
        document.getElementById('mc-pick').innerHTML = pickList()
      })

      render()
    </script>
  </body>
</html>
