<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detail screens · Media Manager design library</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/tokens.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/components.css"
    />
    <link rel="stylesheet" href="assets/gallery.css" />
  </head>
  <body class="ds g" data-page="screens-detail.html">
    <script src="assets/ds.js"></script>
    <script>
      const D = DS
      const {
        g,
        btn,
        pill,
        pills,
        rating,
        table,
        card,
        section,
        stats,
        facts,
        kv,
        icon,
        status,
        mark,
      } = D
      const {
        ALBUMS: A,
        ALBUM_TRACKS: AT,
        ARTISTS: AR,
        FILMS: F,
        PLAYLISTS: PL,
        VIDEOS: V,
      } = D.data

      const ratingCards = (list) =>
        `<div class="ds-ratings">${list.map(([v, l]) => `<div class="ds-ratingcard"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`
      const md = { pill: { size: 'md' }, wrap: true }
      // Each tag pill in a detail overview carries the sources icon.
      const sourced = { pill: { size: 'md', sources: true }, wrap: true }
      const inspectorFrame = (html, height) =>
        `<div class="g-inspector" style="--g-h:${height || 760}px">${html}</div>`
      const linkBtn = (label) => btn(label, { variant: 'link' })

      /* Headers */
      const albumHead = D.detailHead({
        item: A[0],
        kind: 'Album',
        by: 'by <a href="#">Mira Kestrel</a>',
        facts: ['2019-03-08', '11 tracks', '42:18', 'Tidewater'],
        play: D.play('header'),
        links: D.logoLinks([
          'spotify',
          'lastfm',
          'musicbrainz',
          'discogs',
          'rym',
        ]),
        actions: D.headActions(),
      })
      const trackHead = D.detailHead({
        item: A[0],
        kind: 'Track',
        title: 'Harbour Lights',
        by: 'by <a href="#">Mira Kestrel</a> · on <a href="#">Harbour Lights</a>',
        facts: ['3:48', 'Track 3 of 11', '2019'],
        play: D.play('header'),
        links: D.logoLinks(['spotify', 'lastfm']),
        actions: D.headActions(),
      })
      const artistHead = D.detailHead({
        item: AR[0],
        kind: 'Artist',
        facts: ['New Zealand', '3 albums', '31 tracks'],
        links: D.logoLinks(['spotify', 'lastfm', 'musicbrainz', 'discogs']),
        actions: D.headActions(),
      })
      const filmHead = D.detailHead({
        item: F[0],
        kind: 'Film',
        by: 'directed by <a href="#">Anneke Solberg</a>',
        facts: ['2021', '1h 52m', 'Norway', 'Watched 2026-09-21'],
        links: D.logoLinks(['tmdb', 'imdb', 'letterboxd']),
        actions: D.headActions({
          lead: btn('Watched', { icon: 'check', size: 'md', pressed: true }),
        }),
      })
      const playlistHead = D.detailHead({
        item: PL[0],
        kind: 'Track playlist',
        by: 'from <a href="#">Spotify</a>',
        facts: ['42 tracks', '2h 51m', 'Updated 2026-11-09'],
        play: D.play('header'),
        links: D.logoLinks(['spotify']),
        actions: D.headActions(),
      })
      /* A playlist's More menu: its type is a setting, so it is a ticked
         group here and not a control in the header */
      const playlistMore = D.menu(
        [
          [null, 'Filter tracks'],
          [null, 'Filter albums'],
          {
            group: 'Playlist type',
            choices: [
              ['Automatic', true],
              ['Album playlist'],
              ['Track playlist'],
            ],
          },
          [null, 'Open page'],
          [null, 'Copy link'],
        ],
        '',
        { label: 'More actions' },
      )
      const channelHead = D.detailHead({
        item: { kind: 'artist', seed: 9, title: 'Slow Workshop' },
        kind: 'Channel',
        facts: ['YouTube', '24 videos', 'Last upload 2026-11-12'],
        links: D.logoLinks(['youtube']),
        actions: D.headActions({
          lead: btn('Subscribed', { icon: 'check', size: 'md', pressed: true }),
        }),
      })
      const personHead = D.detailHead({
        item: { kind: 'person', seed: 2, title: 'Anneke Solberg' },
        kind: 'Person',
        facts: ['Director, writer', '4 films'],
        links: D.logoLinks(['tmdb', 'imdb']),
        actions: D.headActions(),
      })

      /* Album */
      const trackTable = (cols, rows) =>
        `<div class="ds-table-wrap">${table(cols, rows, { row: (r) => ({ 'data-state': r.n === 2 ? 'playing' : r.n === 5 ? 'hover' : undefined }) })}</div>`
      const albumSummary = stats([
        ['412', 'scrobbles', { extra: D.sparkOf('album') }],
        [
          '3.71',
          'Rate Your Music',
          { href: '#', title: 'RYM rating: 3.71 out of 5. 4,218 votes.' },
        ],
        [
          '4.4',
          'Discogs',
          { href: '#', title: 'Discogs rating: 4.4 out of 5. 312 votes.' },
        ],
        ['2026-11-09', 'last played'],
      ])
      const albumTags =
        section('Album tags', pills(['Dream Pop'], sourced), {
          aside: linkBtn('Manage tags'),
        }) +
        section('Artist tags', pills(['Bedroom Pop', 'New Zealand'], sourced))
      const albumDetails = [
        ['Released', '2019-03-08'],
        ['Added', '2026-10-02'],
        ['Label', '<a href="#">Tidewater</a>'],
        ['Type', 'Album'],
        ['Country', 'New Zealand'],
        ['Catalogue no.', 'TDW-041'],
      ]
      const albumOverview =
        section('', albumSummary, { flush: true }) +
        section('Tracks', trackTable(D.COLS.albumTracks, AT), {
          note: '11 · 42:18',
        }) +
        albumTags +
        section('Playlists', pills(['Late shift', 'Kitchen'], md), {
          aside: linkBtn('Add to Spotify playlist'),
        }) +
        section('Details', facts(albumDetails), {
          aside: linkBtn('All fields'),
        })

      const byTrack = table(
        [
          {
            h: '#',
            w: 40,
            end: true,
            c: (r) => `<span class="ds-muted">${r.n}</span>`,
          },
          { h: 'Title', c: (r) => D.idCell(r, { thumb: false }) },
          { h: 'Scrobbles', end: true, w: 88, c: (r) => r.plays },
          {
            h: '',
            w: 120,
            c: (r) => D.meter(Math.round((r.plays / 74) * 100)),
          },
          {
            h: 'Last played',
            w: 96,
            c: (r) =>
              `2026-${r.n % 2 ? '11' : '10'}-${String(28 - r.n * 2).padStart(2, '0')}`,
          },
        ],
        [...AT].sort((a, b) => b.plays - a.plays).slice(0, 6),
      )
      const albumListening =
        section(
          '',
          stats([
            ['412', 'scrobbles'],
            ['2019-04-02', 'first played'],
            ['2026-11-09', 'last played'],
            ['Mar 2020', 'busiest month'],
          ]),
          { flush: true },
        ) +
        section(
          'Over time',
          D.chartBox('album', {
            range: 'All',
            extra: D.select(['All tracks', ...AT.map((t) => t.title)], {
              label: 'Track',
            }),
          }),
        ) +
        section('By track', `<div class="ds-table-wrap">${byTrack}</div>`, {
          aside: linkBtn('All 11'),
        }) +
        D.notice('Scrobble names are matched in Sources, under Last.fm.', {
          action: btn('Open Sources', { size: 'xs' }),
        })

      const albumInspector = (tab, body) =>
        D.inspector({
          crumbs: ['Albums', 'Harbour Lights'],
          head: albumHead,
          tabs: ['Overview', 'Listening', 'Sources', 'Edit'],
          tab,
          body,
        })

      const oldOverview = `<div class="g-old"><div style="display:flex;gap:6px;margin-bottom:12px">${['Overview', 'Playlists', 'Tracks (11)', 'Listening', 'Sources', 'Edit'].map((t, i) => `<span class="g-old-pill" style="background:${i ? '#edf0f4' : '#334155'};color:${i ? '#171717' : '#fff'}">${t}</span>`).join('')}</div><dl class="g-old-metrics">${[
        ['Released', '08/03/2019'],
        ['Added', '02/10/2026'],
        ['Duration', '42:18'],
        ['Tracks', '11'],
        ['Scrobbles', '412'],
        ['RYM rating', '3.71'],
        ['RYM votes', '4,218'],
        ['RYM rank', '1,204'],
        ['Discogs rating', '4.4'],
        ['Discogs votes', '312'],
        ['Discogs have', '2,907'],
        ['Discogs want', '1,150'],
        ['Last.fm listeners', '88,410'],
        ['Last.fm plays', '1,902,337'],
        ['Popularity', '47'],
      ]
        .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`)
        .join(
          '',
        )}</dl><div style="margin-top:14px;font-weight:600">Genres</div><div style="display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:6px;align-items:center">${[
        'dream pop',
        'shoegaze',
        'ethereal wave',
      ]
        .map(
          (t) =>
            `<span class="g-old-pill" style="background:#edf0f4">${t}</span>${icon('layers', { size: 'sm' })}`,
        )
        .join(
          '',
        )}</div><div style="margin-top:14px;font-weight:600">Spotify genres</div><div style="margin-top:6px;color:#667080">…and one section per provider facet below</div></div>`

      /* Standalone page */
      const pageTracks = table(
        [
          {
            h: '#',
            w: 40,
            end: true,
            c: (r) => `<span class="ds-muted">${r.n}</span>`,
          },
          {
            h: 'Title',
            c: (r) => D.idCell(r, { thumb: false, playing: r.n === 2 }),
          },
          { h: 'Duration', end: true, w: 80, c: (r) => r.duration },
          { h: 'Scrobbles', end: true, w: 88, c: (r) => r.plays },
          {
            h: 'Last played',
            w: 100,
            c: (r) =>
              `2026-${r.n % 2 ? '11' : '10'}-${String(28 - r.n * 2).padStart(2, '0')}`,
          },
          {
            h: 'Playlists',
            c: (r) =>
              r.n % 3 === 0
                ? pills(['Late shift'], {})
                : r.n === 2
                  ? pills(['Late shift', 'Kitchen'], {})
                  : D.EMPTY,
          },
        ],
        AT,
        { row: (r) => ({ 'data-state': r.n === 2 ? 'playing' : undefined }) },
      )
      const sourceSummary = [
        ['spotify', status('done', 'Matched'), '3 days ago'],
        ['lastfm', status('done', 'Matched'), 'Today'],
        ['discogs', status('done', 'Matched'), '12 days ago'],
        ['rym', status('waiting', 'Waiting'), '41 days ago'],
        ['musicbrainz', status('attention', 'Needs ID'), 'Never'],
      ]
        .map(
          ([p, st, when]) =>
            `<div class="ds-coverage" style="grid-template-columns:18px minmax(0,1fr) auto auto">${mark(p, { hidden: true })}<a href="#">${D.PROVIDERS[p].name}</a>${st}<span class="ds-muted ds-num" style="width:76px;text-align:right">${when}</span></div>`,
        )
        .join('')
      const albumPage = `<div class="ds-page">${albumHead}${D.tabs(['Overview', 'Sources', 'Edit'], 0).replace('class="ds-tabs"', 'class="ds-tabs" style="margin-top:16px"')}<div class="ds-page-cols"><div>${section('Tracks', `<div class="ds-table-wrap">${pageTracks}</div>`, { note: '11 · 42:18', flush: true })}${section(
        'Listening',
        stats([
          ['412', 'scrobbles'],
          ['2019-04-02', 'first played'],
          ['2026-11-09', 'last played'],
        ]) +
          D.chartBox('album', {
            range: '5y',
            extra: D.select(['All tracks'], { label: 'Track' }),
          }),
      )}</div><div>${section(
        'Ratings',
        ratingCards([
          ['3.71', 'Rate Your Music'],
          ['4.4', 'Discogs'],
        ]),
        { flush: true },
      )}${albumTags}${section('Playlists', pills(['Late shift', 'Kitchen'], md), { aside: linkBtn('Add to Spotify playlist') })}${section('Details', kv(albumDetails))}${section('Sources', sourceSummary, { aside: linkBtn('Manage') })}</div></div></div>`

      /* Track, artist, film */
      const trackOverview =
        section(
          '',
          stats([
            ['74', 'scrobbles'],
            ['2026-11-09', 'last played'],
            ['1st of 11', 'on this album'],
          ]),
          { flush: true },
        ) +
        section(
          'Listening',
          D.chartBox('track', { range: 'All', height: 132 }),
        ) +
        section(
          'Appears in',
          `<div class="ds-list" data-compact>${D.row({ title: 'Harbour Lights', kind: 'album', art: null }, { by: 'Album', play: false })}${D.row({ title: 'Late shift', kind: 'playlist', art: null }, { by: 'Playlist', play: false })}${D.row({ title: 'Sodium Glow', kind: 'track', art: null }, { by: 'Similar tracks', play: false })}</div>`,
          { aside: linkBtn('Add to playlist') },
        ) +
        section(
          'Track tags',
          pills(['Dream Pop', 'Jangle Pop'], sourced) +
            facts([
              [
                'Sonovault, may be another version',
                pills(['Shoegaze'], sourced),
              ],
              ['Removed by you', `Twee Pop ${linkBtn('Restore')}`],
            ]),
          { aside: linkBtn('Edit tags') },
        ) +
        section('Album tags', pills(['Dream Pop'], sourced)) +
        section('Artist tags', pills(['Bedroom Pop', 'New Zealand'], sourced)) +
        section(
          'Details',
          facts([
            ['Length', '3:48'],
            ['Track', '3 of 11'],
            ['Added', '2026-10-02'],
            ['ISRC', '<span class="ds-mono">NZTW01900341</span>'],
          ]),
          { aside: linkBtn('All fields') },
        )

      const artistOverview =
        section(
          '',
          stats([
            ['902', 'scrobbles', { extra: D.sparkOf('artist') }],
            ['2026-11-12', 'last played'],
            ['4', 'playlists'],
            ['2026-10-02', 'added'],
          ]),
          { flush: true },
        ) +
        section(
          'About',
          '<p style="margin:0;color:var(--ds-ink-2)">Songwriter and producer from Dunedin. Three albums of layered guitars and tape-saturated vocals, recorded largely at home between 2016 and 2023.</p>',
        ) +
        section(
          'Albums',
          `<div class="ds-grid" style="--ds-card-min:112px;padding:0;gap:12px">${[
            A[0],
            { ...A[6], title: 'Small Rooms', by: '2016', year: '2016' },
            { ...A[10], title: 'Weathervane', by: '2023', year: '2023' },
          ]
            .map((a, i) =>
              card(
                { ...a, by: undefined },
                {
                  meta: [
                    `<span>${a.year}</span>`,
                    `<span>${[412, 301, 189][i]} scrobbles</span>`,
                  ],
                },
              ),
            )
            .join('')}</div>`,
          { note: '3', aside: linkBtn('Show in Albums') },
        ) +
        section(
          'Top tracks',
          `<div class="ds-table-wrap">${table(
            [
              { h: 'Title', c: (r) => D.idCell(r) },
              { h: 'Album', c: (r) => D.link(r.album) },
              { h: 'Scrobbles', end: true, w: 88, c: (r) => r.plays },
            ],
            [...AT].sort((a, b) => b.plays - a.plays).slice(0, 5),
          )}</div>`,
          { note: '31', aside: linkBtn('Show in Tracks') },
        ) +
        section(
          'Tags',
          pills(
            ['Dream Pop', 'Shoegaze', 'Ethereal Wave', 'Bedroom Pop'],
            sourced,
          ),
        )

      const filmOverview =
        section(
          'Ratings',
          ratingCards([
            ['7.4', 'IMDb'],
            ['78', 'Metacritic'],
            ['91%', 'Rotten Tomatoes'],
            ['3.8', 'Letterboxd'],
            ['7.2', 'TMDb'],
            ['74%', 'Trakt'],
          ]),
          { flush: true },
        ) +
        section(
          'Synopsis',
          '<p style="margin:0;color:var(--ds-ink-2)">A lighthouse surveyor returns to the island where she grew up to chart a coastline that no longer matches the maps.</p>',
        ) +
        section(
          'Cast and crew',
          kv([
            ['Director', pills(['Anneke Solberg'], md)],
            ['Writers', pills(['Anneke Solberg', 'Jonas Reiter'], md)],
            [
              'Cast',
              pills(
                [
                  'Ingrid Vale',
                  'Tobias Holm',
                  'Mara Lind',
                  'Eskil Brandt',
                  'Signe Aas',
                  'Per Olav Nes',
                  'Liv Haug',
                ],
                { ...md, max: 5 },
              ),
            ],
          ]),
        ) +
        section(
          'Tags',
          kv([
            ['Genres', pills(['Drama', 'Slow Cinema'], sourced)],
            [
              'Keywords',
              pills(
                [
                  'Coastal',
                  'Homecoming',
                  'Cartography',
                  'Island',
                  'Grief',
                  'Sea',
                  'Family',
                  'Winter',
                  'Solitude',
                ],
                { ...sourced, max: 6 },
              ),
            ],
          ]),
        ) +
        section(
          'Details',
          facts([
            ['Released', '2021-10-14'],
            ['Runtime', '1h 52m'],
            ['Country', 'Norway'],
            ['Language', 'Norwegian'],
            ['Added', '2026-08-02'],
            ['Watched', '2026-09-21'],
          ]),
          { aside: linkBtn('All fields') },
        ) +
        section('Collections', pills(['Nordic coast', 'Watch again'], md))

      const gridScreen = D.shell({
        library: 'Albums',
        nav: D.libraryNav('Browse'),
        main:
          D.toolbar({
            placeholder: 'Search albums',
            sort: ['Added'],
            view: 0,
            count: '128 albums',
          }) +
          `<div class="ds-main-scroll"><div class="ds-grid">${A.map((a, i) => card(a, { meta: [`<span>${a.year}</span>`, rating('RYM', a.rym)], selected: i === 0 })).join('')}</div></div>`,
      })

      /* Lists inside a detail: the toolbar spans the drawer's width */
      const embedded = (html) =>
        `<div style="margin-inline:calc(var(--ds-gutter) * -1)">${html}</div>`
      const artistTabs = [
        'Overview',
        ['Albums', 3],
        ['Tracks', 31],
        'Listening',
        'Coverage',
        'Sources',
      ]
      const artistAlbums = D.inspector({
        crumbs: ['Artists', 'Mira Kestrel'],
        head: artistHead,
        tabs: artistTabs,
        tab: 1,
        body: embedded(
          D.toolbar({
            placeholder: 'Search albums',
            sort: ['Released'],
            view: 0,
            filterCount: 1,
            short: true,
          }) +
            D.filterLine({
              filters: ['Dream Pop'],
              count: '2 of 3 albums',
              link: 'Show in Albums',
            }) +
            `<div class="ds-grid" style="--ds-card-min:112px">${[
              A[0],
              {
                ...A[10],
                title: 'Weathervane',
                year: '2023',
                tags: ['Dream Pop', 'Bedroom Pop'],
              },
            ]
              .map((a) =>
                card(
                  { ...a, by: undefined },
                  { meta: [`<span>${a.year}</span>`, rating('RYM', a.rym)] },
                ),
              )
              .join('')}</div>`,
        ),
      })
      const artistTracks = D.inspector({
        crumbs: ['Artists', 'Mira Kestrel'],
        head: artistHead,
        tabs: artistTabs,
        tab: 2,
        body: embedded(
          D.toolbar({
            placeholder: 'Search tracks',
            sort: ['Scrobbles'],
            view: 2,
            short: true,
          }) +
            D.filterLine({ count: '31 tracks', link: 'Show in Tracks' }) +
            `<div class="ds-table-wrap">${table(
              [
                { h: 'Title', sort: '', c: (r) => D.idCell(r) },
                { h: 'Album', sort: '', c: (r) => D.link(r.album) },
                {
                  h: 'Scrobbles',
                  sort: 'descending',
                  end: true,
                  w: 88,
                  c: (r) => r.plays,
                },
              ],
              [...AT].sort((a, b) => b.plays - a.plays).slice(0, 8),
            )}</div>`,
        ),
      })
      const playlistTracks = D.inspector({
        crumbs: ['Playlists', PL[0].title],
        head: playlistHead,
        tabs: ['Overview', 'Listening', 'Coverage', 'Sources'],
        body: embedded(
          D.toolbar({
            placeholder: 'Search tracks',
            sort: ['Position'],
            dir: 'up',
            view: 2,
            short: true,
            count: '42 tracks',
          }) +
            `<div class="ds-table-wrap">${table(
              [
                {
                  h: '#',
                  w: 40,
                  end: true,
                  c: (r, i) => `<span class="ds-muted">${i + 1}</span>`,
                },
                { h: 'Title', c: (r) => D.idCell(r) },
                { h: 'Artists', c: (r) => D.link(r.by) },
                { h: 'Duration', end: true, w: 80, c: (r) => r.duration },
              ],
              D.data.TRACKS.slice(0, 8),
            )}</div>`,
        ),
      })

      /* A playlist made in the app: its entries in position order */
      const libraryPlaylist = D.inspector({
        crumbs: ['Playlists', 'Night bus'],
        head: D.detailHead({
          item: { kind: 'playlist', art: null, title: 'Night bus' },
          kind: 'Playlist',
          facts: ['52 tracks', 'Updated 2026-11-28', 'Library'],
          play: D.play('header'),
          actions: D.headActions({
            lead: btn('Filter tracks', { size: 'md' }),
          }),
        }),
        body:
          D.notice('3 tracks are in this playlist more than once.', {
            action: `<span class="ds-actions">${btn('Remove repeats', { size: 'xs' })}</span>`,
          }) +
          section(
            'Tracks',
            `<div class="ds-table-wrap">${table(
              [
                {
                  h: '#',
                  w: 40,
                  end: true,
                  c: (r, i) => `<span class="ds-muted">${i + 1}</span>`,
                },
                { h: 'Title', c: (r) => D.idCell(r) },
                { h: 'Artists', c: (r) => D.link(r.by) },
                {
                  h: 'Added to playlist',
                  w: 110,
                  c: (r, i) => `2026-11-${String(27 - i).padStart(2, '0')}`,
                },
              ],
              D.data.TRACKS.slice(0, 6),
            )}</div>`,
            { flush: true, aside: linkBtn('Show in Tracks') },
          ),
      })

      D.page({
        title: 'Detail screens',
        lede: 'The drawer and the standalone page for each resource. Every one uses the same header, the same tab order and the same section components.',
        sections: [
          {
            id: 'headers',
            title: 'One header for every resource',
            body:
              `<p>Artwork, kind, title, creator, one line of facts, service logos, actions. Only the artwork shape, the facts, the logos and the item's own actions change.</p>` +
