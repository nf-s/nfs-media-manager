<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detail screens · Media Manager design library</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/tokens.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/components.css"
    />
    <link rel="stylesheet" href="assets/gallery.css" />
  </head>
  <body class="ds g" data-page="screens-detail.html">
    <script src="assets/ds.js"></script>
    <script>
      const D = DS
      const {
        g,
        btn,
        pill,
        pills,
        rating,
        table,
        card,
        section,
        stats,
        facts,
        kv,
        icon,
        status,
        mark,
      } = D
      const {
        ALBUMS: A,
        ALBUM_TRACKS: AT,
        ARTISTS: AR,
        FILMS: F,
        PLAYLISTS: PL,
        VIDEOS: V,
      } = D.data

      const ratingCards = (list) =>
        `<div class="ds-ratings">${list.map(([v, l]) => `<div class="ds-ratingcard"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`
      const md = { pill: { size: 'md' }, wrap: true }
      const inspectorFrame = (html, height) =>
        `<div class="g-inspector" style="--g-h:${height || 760}px">${html}</div>`
      const linkBtn = (label) => btn(label, { variant: 'link' })

      /* Headers */
      const albumHead = D.detailHead({
        item: A[0],
        kind: 'Album',
        by: 'by <a href="#">Mira Kestrel</a>',
        facts: ['2019-03-08', '11 tracks', '42:18', 'Tidewater'],
        actions: D.headActions({ open: 'Spotify' }),
      })
      const trackHead = D.detailHead({
        item: A[0],
        kind: 'Track',
        title: 'Harbour Lights',
        by: 'by <a href="#">Mira Kestrel</a> · on <a href="#">Harbour Lights</a>',
        facts: ['3:48', 'Track 3 of 11', '2019'],
        actions: D.headActions({ open: 'Spotify' }),
      })
      const artistHead = D.detailHead({
        item: AR[0],
        kind: 'Artist',
        facts: ['New Zealand', '3 albums', '31 tracks'],
        actions: D.headActions({ open: 'Spotify' }),
      })
      const filmHead = D.detailHead({
        item: F[0],
        kind: 'Film',
        by: 'directed by <a href="#">Anneke Solberg</a>',
        facts: ['2021', '1h 52m', 'Norway', 'Watched 2026-09-21'],
        actions: D.headActions({
          play: false,
          lead: btn('Watched', { icon: 'check', size: 'md', pressed: true }),
          open: 'TMDb',
        }),
      })
      const playlistHead = D.detailHead({
        item: PL[0],
        kind: 'Playlist',
        by: 'from <a href="#">Spotify</a>',
        facts: ['42 tracks', '2h 51m', 'Updated 2026-11-09'],
        actions: D.headActions({ open: 'Spotify' }),
      })
      const channelHead = D.detailHead({
        item: { kind: 'artist', seed: 9, title: 'Slow Workshop' },
        kind: 'Channel',
        facts: ['YouTube', '24 videos', 'Last upload 2026-11-12'],
        actions: D.headActions({
          play: false,
          lead: btn('Subscribed', { icon: 'check', size: 'md', pressed: true }),
          open: 'YouTube',
        }),
      })
      const personHead = D.detailHead({
        item: { kind: 'person', seed: 2, title: 'Anneke Solberg' },
        kind: 'Person',
        facts: ['Director, writer', '4 films'],
        actions: D.headActions({ play: false, open: 'TMDb' }),
      })

      /* Album */
      const trackTable = (cols, rows) =>
        `<div class="ds-table-wrap">${table(cols, rows, { row: (r) => ({ 'data-state': r.n === 2 ? 'playing' : r.n === 5 ? 'hover' : undefined }) })}</div>`
      const albumSummary = stats([
        ['412', 'scrobbles', { extra: D.sparkOf('album') }],
        ['3.71', 'Rate Your Music'],
        ['4.4', 'Discogs'],
        ['2026-11-09', 'last played'],
      ])
      const albumTags =
        section(
          'Album tags',
          pills(
            [
              'dream pop',
              'shoegaze',
              'ethereal wave',
              'nocturnal',
              'lush',
              'atmospheric',
            ],
            md,
          ),
          { aside: linkBtn('Manage tags') },
        ) + section('Artist tags', pills(['bedroom pop', 'new zealand'], md))
      const albumDetails = [
        ['Released', '2019-03-08'],
        ['Added', '2026-10-02'],
        ['Label', '<a href="#">Tidewater</a>'],
        ['Type', 'Album'],
        ['Country', 'New Zealand'],
        ['Catalogue no.', 'TDW-041'],
      ]
      const albumOverview =
        section('', albumSummary, { flush: true }) +
        section('Tracks', trackTable(D.COLS.albumTracks, AT), {
          note: '11 · 42:18',
        }) +
        albumTags +
        section('Playlists', pills(['Late shift', 'Kitchen'], md), {
          aside: linkBtn('Add to playlist'),
        }) +
        section('Details', facts(albumDetails), {
          aside: linkBtn('All fields'),
        })

      const byTrack = table(
        [
          {
            h: '#',
            w: 40,
            end: true,
            c: (r) => `<span class="ds-muted">${r.n}</span>`,
          },
          { h: 'Title', c: (r) => D.idCell(r, { thumb: false }) },
          { h: 'Scrobbles', end: true, w: 88, c: (r) => r.plays },
          {
            h: '',
            w: 120,
            c: (r) => D.meter(Math.round((r.plays / 74) * 100)),
          },
          {
            h: 'Last played',
            w: 96,
            c: (r) =>
              `2026-${r.n % 2 ? '11' : '10'}-${String(28 - r.n * 2).padStart(2, '0')}`,
          },
        ],
        [...AT].sort((a, b) => b.plays - a.plays).slice(0, 6),
      )
      const albumListening =
        section(
          '',
          stats([
            ['412', 'scrobbles'],
            ['2019-04-02', 'first played'],
            ['2026-11-09', 'last played'],
            ['Mar 2020', 'busiest month'],
          ]),
          { flush: true },
        ) +
        section(
          'Over time',
          D.chartBox('album', {
            range: 'All',
            extra: D.select(['All tracks', ...AT.map((t) => t.title)], {
              label: 'Track',
            }),
          }),
        ) +
        section('By track', `<div class="ds-table-wrap">${byTrack}</div>`, {
          aside: linkBtn('All 11'),
        }) +
        D.notice('Scrobble names are matched in Sources, under Last.fm.', {
          action: btn('Open Sources', { size: 'xs' }),
        })

      const albumInspector = (tab, body) =>
        D.inspector({
          crumbs: ['Albums', 'Harbour Lights'],
          head: albumHead,
          tabs: ['Overview', 'Listening', 'Sources', 'Edit'],
          tab,
          body,
        })

      const oldOverview = `<div class="g-old"><div style="display:flex;gap:6px;margin-bottom:12px">${['Overview', 'Playlists', 'Tracks (11)', 'Listening', 'Sources', 'Edit'].map((t, i) => `<span class="g-old-pill" style="background:${i ? '#edf0f4' : '#334155'};color:${i ? '#171717' : '#fff'}">${t}</span>`).join('')}</div><dl class="g-old-metrics">${[
        ['Released', '08/03/2019'],
        ['Added', '02/10/2026'],
        ['Duration', '42:18'],
        ['Tracks', '11'],
        ['Scrobbles', '412'],
        ['RYM rating', '3.71'],
        ['RYM votes', '4,218'],
        ['RYM rank', '1,204'],
        ['Discogs rating', '4.4'],
        ['Discogs votes', '312'],
        ['Discogs have', '2,907'],
        ['Discogs want', '1,150'],
        ['Last.fm listeners', '88,410'],
        ['Last.fm plays', '1,902,337'],
        ['Popularity', '47'],
      ]
        .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`)
        .join(
          '',
        )}</dl><div style="margin-top:14px;font-weight:600">Genres</div><div style="display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:6px;align-items:center">${[
        'dream pop',
        'shoegaze',
        'ethereal wave',
      ]
        .map(
          (t) =>
            `<span class="g-old-pill" style="background:#edf0f4">${t}</span>${icon('layers', { size: 'sm' })}`,
        )
        .join(
          '',
        )}</div><div style="margin-top:14px;font-weight:600">Spotify genres</div><div style="margin-top:6px;color:#667080">…and one section per provider facet below</div></div>`

      /* Standalone page */
      const pageTracks = table(
        [
          {
            h: '#',
            w: 40,
            end: true,
            c: (r) => `<span class="ds-muted">${r.n}</span>`,
          },
          {
            h: 'Title',
            c: (r) => D.idCell(r, { thumb: false, playing: r.n === 2 }),
          },
          { h: 'Duration', end: true, w: 80, c: (r) => r.duration },
          { h: 'Scrobbles', end: true, w: 88, c: (r) => r.plays },
          {
            h: 'Last played',
            w: 100,
            c: (r) =>
              `2026-${r.n % 2 ? '11' : '10'}-${String(28 - r.n * 2).padStart(2, '0')}`,
          },
          {
            h: 'Playlists',
            c: (r) =>
              r.n % 3 === 0
                ? pills(['Late shift'], {})
                : r.n === 2
                  ? pills(['Late shift', 'Kitchen'], {})
                  : D.EMPTY,
          },
        ],
        AT,
        { row: (r) => ({ 'data-state': r.n === 2 ? 'playing' : undefined }) },
      )
      const sourceSummary = [
        ['spotify', status('done', 'Matched'), '3 days ago'],
        ['lastfm', status('done', 'Matched'), 'Today'],
        ['discogs', status('done', 'Matched'), '12 days ago'],
        ['rym', status('waiting', 'Waiting'), '41 days ago'],
        ['musicbrainz', status('attention', 'Needs ID'), 'Never'],
      ]
        .map(
          ([p, st, when]) =>
            `<div class="ds-coverage" style="grid-template-columns:18px minmax(0,1fr) auto auto">${mark(p)}<a href="#">${D.PROVIDERS[p].name}</a>${st}<span class="ds-muted ds-num" style="width:76px;text-align:right">${when}</span></div>`,
        )
        .join('')
      const albumPage = `<div class="ds-page">${albumHead}${D.tabs(['Overview', 'Sources', 'Edit'], 0).replace('class="ds-tabs"', 'class="ds-tabs" style="margin-top:16px"')}<div class="ds-page-cols"><div>${section('Tracks', `<div class="ds-table-wrap">${pageTracks}</div>`, { note: '11 · 42:18', flush: true })}${section(
        'Listening',
        stats([
          ['412', 'scrobbles'],
          ['2019-04-02', 'first played'],
          ['2026-11-09', 'last played'],
        ]) +
          D.chartBox('album', {
            range: '5y',
            extra: D.select(['All tracks'], { label: 'Track' }),
          }),
      )}</div><div>${section(
        'Ratings',
        ratingCards([
          ['3.71', 'Rate Your Music'],
          ['4.4', 'Discogs'],
        ]),
        { flush: true },
      )}${albumTags}${section('Playlists', pills(['Late shift', 'Kitchen'], md), { aside: linkBtn('Add to playlist') })}${section('Details', kv(albumDetails))}${section('Sources', sourceSummary, { aside: linkBtn('Manage') })}</div></div></div>`

      /* Track, artist, film */
      const trackOverview =
        section(
          '',
          stats([
            ['74', 'scrobbles'],
            ['2026-11-09', 'last played'],
            ['1st of 11', 'on this album'],
          ]),
          { flush: true },
        ) +
        section(
          'Listening',
          D.chartBox('track', { range: 'All', height: 132 }),
        ) +
        section(
          'Appears on',
          `<div class="ds-list" data-compact style="margin:0 -12px">${D.row(A[0], { by: 'Album · Mira Kestrel · 2019' })}</div>${pills(['Late shift', 'Kitchen'], md)}`,
          { aside: linkBtn('Add to playlist') },
        ) +
        section('Album tags', pills(['dream pop', 'shoegaze'], md)) +
        section(
          'Details',
          facts([
            ['Length', '3:48'],
            ['Track', '3 of 11'],
            ['Added', '2026-10-02'],
            ['ISRC', '<span class="ds-mono">NZTW01900341</span>'],
          ]),
          { aside: linkBtn('All fields') },
        )

      const artistOverview =
        section(
          '',
          stats([
            ['902', 'scrobbles', { extra: D.sparkOf('artist') }],
            ['2026-11-12', 'last played'],
            ['4', 'playlists'],
            ['2026-10-02', 'added'],
          ]),
          { flush: true },
        ) +
        section(
          'About',
          '<p style="margin:0;color:var(--ds-ink-2)">Songwriter and producer from Dunedin. Three albums of layered guitars and tape-saturated vocals, recorded largely at home between 2016 and 2023.</p>',
        ) +
        section(
          'Albums',
          `<div class="ds-grid" style="--ds-card-min:112px;padding:0;gap:12px">${[
            A[0],
            { ...A[6], title: 'Small Rooms', by: '2016', year: '2016' },
            { ...A[10], title: 'Weathervane', by: '2023', year: '2023' },
          ]
            .map((a, i) =>
              card(
                { ...a, by: undefined },
                {
                  meta: [
                    `<span>${a.year}</span>`,
                    `<span>${[412, 301, 189][i]} scrobbles</span>`,
                  ],
                },
              ),
            )
            .join('')}</div>`,
          { note: '3', aside: linkBtn('Show in Albums') },
        ) +
        section(
          'Top tracks',
          `<div class="ds-table-wrap">${table(
            [
              { h: 'Title', c: (r) => D.idCell(r) },
              { h: 'Album', c: (r) => D.link(r.album) },
              { h: 'Scrobbles', end: true, w: 88, c: (r) => r.plays },
            ],
            [...AT].sort((a, b) => b.plays - a.plays).slice(0, 5),
          )}</div>`,
          { note: '31', aside: linkBtn('Show in Tracks') },
        ) +
        section(
          'Tags',
          pills(['dream pop', 'shoegaze', 'ethereal wave', 'bedroom pop'], md),
        )

      const filmOverview =
        section(
          'Ratings',
          ratingCards([
            ['7.4', 'IMDb'],
            ['78', 'Metacritic'],
            ['91%', 'Rotten Tomatoes'],
            ['3.8', 'Letterboxd'],
            ['7.2', 'TMDb'],
            ['74%', 'Trakt'],
          ]),
          { flush: true },
        ) +
        section(
          'Synopsis',
          '<p style="margin:0;color:var(--ds-ink-2)">A lighthouse surveyor returns to the island where she grew up to chart a coastline that no longer matches the maps.</p>',
        ) +
        section(
          'Cast and crew',
          kv([
            ['Director', pills(['Anneke Solberg'], md)],
            ['Writers', pills(['Anneke Solberg', 'Jonas Reiter'], md)],
            [
              'Cast',
              pills(
                [
                  'Ingrid Vale',
                  'Tobias Holm',
                  'Mara Lind',
                  'Eskil Brandt',
                  'Signe Aas',
                  'Per Olav Nes',
                  'Liv Haug',
                ],
                { ...md, max: 5 },
              ),
            ],
          ]),
        ) +
        section(
          'Tags',
          kv([
            ['Genres', pills(['drama', 'slow cinema'], md)],
            [
              'Keywords',
              pills(
                [
                  'coastal',
                  'homecoming',
                  'cartography',
                  'island',
                  'grief',
                  'sea',
                  'family',
                  'winter',
                  'solitude',
                ],
                { ...md, max: 6 },
              ),
            ],
          ]),
        ) +
        section(
          'Details',
          facts([
            ['Released', '2021-10-14'],
            ['Runtime', '1h 52m'],
            ['Country', 'Norway'],
            ['Language', 'Norwegian'],
            ['Added', '2026-08-02'],
            ['Watched', '2026-09-21'],
          ]),
          { aside: linkBtn('All fields') },
        ) +
        section('Collections', pills(['Nordic coast', 'Watch again'], md))

      const gridScreen = D.shell({
        library: 'Albums',
        nav: D.libraryNav('Browse'),
        main:
          D.toolbar({
            placeholder: 'Search albums',
            sort: ['Added'],
            view: 0,
            count: '128 albums',
          }) +
          `<div class="ds-main-scroll"><div class="ds-grid">${A.map((a, i) => card(a, { meta: [`<span>${a.year}</span>`, rating('RYM', a.rym)], selected: i === 0 })).join('')}</div></div>`,
      })

      D.page({
        title: 'Detail screens',
        lede: 'The drawer and the standalone page for each resource. Every one uses the same header, the same tab order and the same section components.',
        sections: [
          {
            id: 'headers',
            title: 'One header for every resource',
            body:
              `<p>Artwork, kind, title, creator, one line of facts, actions. Only the artwork shape and the facts change.</p>` +
              `<div class="g-cols" style="grid-template-columns:repeat(auto-fit,minmax(440px,1fr))">${[albumHead, trackHead, artistHead, filmHead, playlistHead, channelHead, personHead].map((h) => g.spec(h)).join('')}</div>` +
              g.rules([
                '<b>Title 18px</b> everywhere in the drawer. Today the same slot is 18, 20, 22 or 28px depending on the resource.',
                '<b>Creators and parents are links</b> in the byline: artist, album, director, provider.',
                '<b>Play and Queue</b> lead the actions for anything playable. A film or channel puts its own state there instead: Watched, Subscribed.',
                '<b>Open at provider and More</b> are always the last two, at the right.',
              ]),
          },
          {
            id: 'tabs',
            title: 'Tabs for every resource',
            body:
              g.spec(
                g.doc(
                  ['Resource', 'Before', 'Now'],
                  [
                    [
                      'Album',
                      'Overview · Playlists · Tracks · Listening · Sources · Edit',
                      'Overview · Listening · Sources · Edit',
                    ],
                    [
                      'Track',
                      'Overview · Playlists · Listening · Sources',
                      'Overview · Sources',
                    ],
                    [
                      'Artist',
                      'Overview · Albums · Tracks · Playlists · Sources',
                      'Overview · Albums · Tracks · Listening · Coverage · Sources',
                    ],
                    [
                      'Playlist',
                      'Tracks · Sources',
                      'Overview · Listening · Coverage · Sources',
                    ],
                    [
                      'Film',
                      'Overview · Sources · Edit',
                      'Overview · Sources · Edit',
                    ],
                    [
                      'Person, collection',
                      'Films · Sources',
                      'Overview · Sources',
                    ],
                    [
                      'Channel',
                      'Videos or Episodes · Sources',
                      'Overview · Sources',
                    ],
                    [
                      'Subscription item',
                      'Overview · Sources',
                      'Overview · Sources',
                    ],
                    [
                      'Tag',
                      'A separate dialog, no tabs',
                      'Overview · Sources, in the shared drawer',
                    ],
                    [
                      'Job',
                      'Overview · Stored JSON · Logs',
                      'Overview · Request and response · Logs',
                    ],
                  ],
                ),
                { flush: true },
              ) +
              g.rules([
                "<b>Overview is always first</b> and always holds the item's contents: tracks for an album or playlist, films for a person or collection, videos for a channel.",
                "<b>A tab exists only when it holds more than one block.</b> Playlists is a section of Overview; it is a tab with a single button today. A track's listening chart sits in its Overview.",
                '<b>Listening is added for artists and playlists,</b> which have none today.',
                '<b>Coverage is a tab for artists and playlists,</b> never a section of Overview.',
                '<b>Sources is last,</b> before Edit. Every tab can be linked to directly.',
                '<b>Tabs are underlined,</b> the same control the provider pages use.',
              ]),
          },
          {
            id: 'album',
            title: 'Album · Overview',
            body:
              `<p>The overview used to be a grid of fifteen figures followed by a section for each provider's tag facet, with a source icon after every tag, and the tracks were on another tab. It now leads with four figures, then the tracks.</p>` +
              `<div class="g-pair" data-split="narrow"><div>${g.label('Before')}${g.spec(oldOverview)}${g.rules(
                [
                  'Every numeric field is shown, including provider statistics nobody reads here',
                  'Dates are DD/MM/YYYY here and ISO in the browse table',
                  'A source icon after each tag doubles the visual weight of the tag list',
                  'Tracks need a second click and bring a second toolbar with Artist and Album columns that repeat the header',
                ],
              )}</div><div>${g.label('Now', 'new')}${inspectorFrame(albumInspector(0, albumOverview), 900)}</div></div>` +
              g.rules([
                '<b>Summary:</b> scrobbles with an all-time sparkline, the headline ratings and last played. Provider statistics (votes, have, want, listeners) move to each source.',
                '<b>Tracks are a compact table</b> in the overview: number, title, duration, scrobbles. No toolbar, no Artist or Album column. An Artist column appears only on a compilation. Past 20 tracks the list shows the first 20 and a Show all button.',
                '<b>Each tag group is its own section</b> (Album tags, Artist tags; Genres, Keywords on a film), merged across providers and set flush left like Playlists and Details. Which provider supplied a tag is answered in Sources.',
                '<b>Details</b> holds six facts. All fields opens the full list with the source of each.',
                '<b>A section has one action,</b> a link button at the end of its heading: Manage tags, Add to playlist, All fields. No section uses a bordered button or an icon for it.',
              ]) +
              g.sub('The drawer over the grid') +
              `<div class="g-scroll"><div class="g-screen" style="--g-h:720px">${gridScreen}${albumInspector(0, albumOverview)}</div></div>`,
          },
          {
            id: 'album-listening',
            title: 'Album · Listening',
            body:
              `<div class="g-pair" data-split="narrow"><div>${g.label('Before')}${g.spec(
                `<div class="g-old"><div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px"><span class="g-old-pill" style="background:#edf0f4">Year</span><span class="g-old-pill" style="background:#334155;color:#fff">Month</span><span class="g-old-pill" style="background:#edf0f4">Bar</span><span class="g-old-pill" style="background:#334155;color:#fff">Line</span></div><div class="g-old-chart"><i></i></div><div style="margin-top:14px;font-weight:600">Linked scrobble names</div><div style="margin-top:6px;display:flex;gap:8px;align-items:center"><span class="g-old-pill" style="background:#edf0f4">Remove</span>Harbour Lights</div><div style="margin-top:14px;font-weight:600">Similar unlinked names</div><div style="margin-top:6px;display:flex;gap:8px;align-items:center"><span class="g-old-pill" style="background:#edf0f4">Add</span>Harbour Lights (Deluxe)</div></div>`,
              )}${g.rules([
                'One month of data draws a single hollow dot',
                'Year or Month only, no values on hover',
                'Name matching, a data-cleaning task, sits under the chart',
              ])}</div><div>${g.label('Now', 'new')}${inspectorFrame(albumInspector(1, albumListening), 800)}</div></div>` +
              g.rules([
                '<b>The same chart as everywhere else,</b> with the track picker beside the range.',
                "<b>By track</b> ranks the album's tracks, with a bar for share and the last play.",
                '<b>Scrobble name matching moves to Sources,</b> under Last.fm, where the rest of the matching lives. A one-line notice points to it.',
              ]),
          },
          {
            id: 'page',
            title: 'Album · standalone page',
            body:
              `<p>The page used to be the drawer's column stretched to 1100px, with the right half empty. It now has two columns: contents and listening on the left, reference information on the right.</p>` +
              `<div class="g-scroll"><div class="g-panel" style="min-width:1040px">${albumPage}</div></div>` +
              g.rules([
