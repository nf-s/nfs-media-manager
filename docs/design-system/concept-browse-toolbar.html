<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Concept: compact Browse toolbar · Media Manager design library
    </title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/tokens.css"
    />
    <link
      rel="stylesheet"
      href="../../packages/ui/src/design-system/components.css"
    />
    <link rel="stylesheet" href="assets/gallery.css" />
    <!--
      Styles for the concepts go here while they are concepts. Use only the
      tokens. The accepted concept's styles move to components.css.
    -->
    <style>
      /* Frames that stand for a Browse page, a detail drawer and a phone */
      .c-frames {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: var(--ds-6);
      }
      .c-frame {
        display: grid;
        gap: var(--ds-3);
        max-width: 100%;
      }
      .c-frame > small {
        color: var(--ds-ink-3);
        font-size: var(--ds-text-xs);
      }
      .c-box {
        position: relative;
        border-radius: var(--ds-r-lg);
        overflow: hidden;
        background: var(--ds-surface);
        box-shadow: 0 0 0 1px var(--ds-line);
      }
      .c-box[data-tall] {
        min-height: calc(var(--ds-9) * 13);
      }
      .c-box .ds-grid {
        padding: 0 var(--ds-gutter) var(--ds-5);
      }
      .c-box[data-width='drawer'] .ds-grid {
        --ds-card-min: calc(var(--ds-9) * 4);
      }
      .c-box[data-width='phone'] .ds-grid {
        --ds-card-min: calc(var(--ds-9) * 3);
        gap: var(--ds-6) var(--ds-5);
      }
      /* The toolbar wraps by the width of its frame here, not of the window */
      .c-box[data-width='phone'] .ds-toolbar {
        flex-wrap: wrap;
      }
      .c-box[data-width='phone'] .ds-toolbar > .ds-search {
        flex-basis: 100%;
      }
      .c-head {
        display: flex;
        align-items: center;
        gap: var(--ds-4);
        padding: var(--ds-4) var(--ds-gutter) 0;
        color: var(--ds-ink-3);
        font-size: var(--ds-text-sm);
      }
      .c-head .ds-tabs {
        flex: 1;
      }

      /* Sort picker: the select's own box, a fixed width, the label cut short */
      .c-sort {
        flex: none;
        width: calc(var(--ds-9) * 3.5);
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .c-box[data-width='phone'] .c-sort {
        flex: 1;
        width: auto;
      }
      .c-sortpop {
        width: calc(var(--ds-9) * 7);
      }
      .c-sortpop .ds-search {
        margin-bottom: var(--ds-2);
      }
      .c-sortpop .ds-menu-item .ds-i {
        flex: none;
        color: var(--ds-ink-3);
      }
      .c-slot {
        flex: none;
        width: 14px;
      }

      /* Active filters under an embedded list's toolbar */
      .c-filterline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--ds-3);
        padding: 0 var(--ds-gutter) var(--ds-4);
      }
      .c-filterline .ds-toolbar-count {
        margin-left: auto;
      }

      /* What the one button opens */
      .c-drawer.ds-inspector {
        width: calc(var(--ds-9) * 11);
        border-radius: var(--ds-r-lg);
      }
      .c-drawer .ds-inspector-bar h2 {
        margin: 0 auto 0 var(--ds-3);
        font-size: var(--ds-text-md);
        font-weight: 600;
      }
      .c-drawer .ds-inspector-body {
        padding: 0 var(--ds-5) var(--ds-5);
      }
      .c-group {
        display: grid;
        justify-items: start;
        gap: var(--ds-4);
      }
      .c-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--ds-3) var(--ds-4);
        width: 100%;
      }
      .c-fields .ds-select {
        grid-column: 1 / -1;
      }
      .c-optpop {
        width: calc(var(--ds-9) * 10);
        padding: var(--ds-5);
      }
      .c-optpop .ds-section:first-child {
        padding-top: 0;
      }
      .c-optpop .ds-section:last-child {
        padding-bottom: 0;
      }
      .c-inline {
        display: grid;
        gap: var(--ds-4);
        margin: 0 var(--ds-gutter) var(--ds-5);
        padding: var(--ds-4) var(--ds-5) var(--ds-5);
        border-radius: var(--ds-r-md);
        background: var(--ds-sunken);
      }
      .c-inline .c-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--ds-4);
      }
      .c-inline .ds-input {
        width: calc(var(--ds-9) * 3);
      }
      .c-anchor {
        display: grid;
        justify-items: end;
        gap: var(--ds-2);
        padding: 0 var(--ds-gutter) var(--ds-5);
      }
    </style>
  </head>
  <body class="ds g" data-page="concept-browse-toolbar.html">
    <script src="assets/ds.js"></script>
    <script>
      const D = DS
      const { g, btn, pills, icon, seg, search, select, esc, section } = D
      const A = D.data.ALBUMS

      /* Shared pieces ------------------------------------------------------ */

      const views = (selected = 0) => seg(D.VIEWS, selected, { label: 'View' })
      const density = seg(['Compact', 'Standard', 'Roomy'], 1, {
        label: 'Grid size',
      })
      const cards = (n) =>
        `<div class="ds-grid">${A.slice(0, n)
          .map((a) =>
            D.card(a, {
              meta: [`<span>${a.year}</span>`, D.rating('RYM', a.rym)],
              tags: false,
            }),
          )
          .join('')}</div>`
      const frame = (label, width, html, o = {}) =>
        `<div class="c-frame" style="width:${width}px"><small>${label}</small><div class="c-box" data-width="${o.kind}"${o.tall ? ' data-tall' : ''}>${html}</div></div>`
      const artistTabs = `<div class="c-head">${D.tabs(
        ['Overview', ['Albums', 14], ['Tracks', 162], 'Listening', 'Sources'],
        1,
      )}</div>`

      /* The sort picker: closed, open, and after typing */
      const sortPick = (label) =>
        `<button type="button" class="ds-select c-sort" aria-haspopup="listbox" aria-label="Sort by: ${esc(label)}">${esc(label)}</button>`
      const sortItem = ([label, on]) =>
        `<button type="button" class="ds-menu-item" role="option" aria-selected="${Boolean(on)}">${on ? icon('check', { size: 'sm' }) : '<span class="c-slot"></span>'}${esc(label)}</button>`
      const sortPop = (items, query) =>
        `<div class="ds-pop c-sortpop" role="listbox" aria-label="Sort by">${search('Find a field', { value: query })}${items.map(sortItem).join('')}</div>`
      const sortFields = [
        ['Added', true],
        ['Released'],
        ['Title'],
        ['Artists'],
        ['Tracks'],
        ['Scrobbles'],
        ['Scrobbles, last year'],
        ['Last listened'],
        ['RYM rating'],
      ]

      /* The one button, with its label or as an icon with the filter count */
      const more = (o = {}) =>
        o.label
          ? btn(o.count ? `${o.label} · ${o.count}` : o.label, {
              icon: 'filter',
              pressed: o.open,
            })
          : `<button type="button" class="ds-btn"${o.count ? '' : ' data-icon'}${o.open ? ' aria-pressed="true"' : ''} aria-label="Filters, columns and grid size${o.count ? `, ${o.count} filters on` : ''}">${icon('filter', { size: 'sm' })}${o.count ? D.count(o.count) : ''}</button>`
      const openIn = (label) =>
        label
          ? btn(label, { end: 'external', variant: 'ghost' })
          : btn('', {
              icon: 'external',
              variant: 'ghost',
              aria: 'Open in Albums',
            })
      const count = (text) => `<span class="ds-toolbar-count">${text}</span>`
      const dir = btn('', { icon: 'down', aria: 'Descending' })

      const filterLine = `<div class="c-filterline">${pills(
        ['Dream Pop', '2012–2025'],
        { pill: { remove: true } },
      )}<span class="ds-toolbar-count">6 of 14 albums</span>${btn('Clear', { variant: 'link' })}</div>`

      /* A toolbar for each width. `o.more` draws the one button. */
      const browseBar = (o) =>
        `<div class="ds-toolbar">${search('Search albums', { ai: true })}${sortPick('Added')}${dir}${views()}${o.more('browse')}${count('14 of 128 albums')}</div>`
      const drawerBar = (o) =>
        `<div class="ds-toolbar">${search('Search albums', { ai: true })}${sortPick('Released')}${dir}${views()}${o.more('drawer')}${openIn('')}</div>`
      const phoneBar = (o) =>
        `<div class="ds-toolbar">${search('Search albums', { ai: true })}${sortPick('Released')}${dir}${views()}${o.more('phone')}${openIn('')}</div>`

      const threeWidths = (o) =>
        `<div class="c-frames">${frame(
          'Browse page, 1040px',
          1040,
          browseBar(o) + (o.under?.browse || '') + cards(5),
          { kind: 'browse' },
        )}</div><div class="c-frames" style="margin-top:16px">${frame(
          'Albums tab of an artist, in the 600px drawer',
          600,
          artistTabs +
            drawerBar(o) +
            (o.under?.drawer ?? filterLine) +
            cards(4),
          { kind: 'drawer' },
        )}${frame(
          'The same tab on a phone, 375px',
          375,
          artistTabs.replace(
            /<button type="button" class="ds-tab" role="tab" aria-selected="false">(Listening|Sources)<\/button>/g,
            '',
          ) +
            phoneBar(o) +
            (o.under?.phone ?? filterLine) +
            cards(3),
          { kind: 'phone' },
        )}</div>`

      /* What the button opens -------------------------------------------- */

      const check = (label, on) =>
        `<label class="ds-checkrow"><input type="checkbox" class="ds-check"${on ? ' checked' : ''} /> ${esc(label)}</label>`
      const viewGroup = `<div class="c-group">${density}${check('Rating on cards', true)}${check('Tags on cards', false)}</div>`
      const columnGroup = `<div class="c-group">${[
        ['Title', true],
        ['Artists', true],
        ['Released', true],
        ['Added', true],
        ['Scrobbles', true],
        ['RYM rating', false],
      ]
        .map(([label, on]) => check(label, on))
        .join('')}</div>`
      const rangeGroup = `<div class="c-fields">${select(['Released'], { label: 'Field' })}<input class="ds-input" value="2012" aria-label="Minimum" /><input class="ds-input" value="2025" aria-label="Maximum" /></div>`
      const listeningGroup = `<div class="c-group">${select(
        ['Played in the last year'],
        { label: 'Listening' },
      )}</div>`

      const drawer = `<aside class="ds-inspector c-drawer"><div class="ds-inspector-bar"><h2>Filters and view</h2>${btn('', { icon: 'x', variant: 'ghost', aria: 'Close' })}</div><div class="ds-inspector-body">${section(
        'View',
        viewGroup,
        { flush: true },
      )}${section('Columns', columnGroup, { note: 'Table', aside: btn('Reset order', { variant: 'link' }) })}${section(
        'Ranges',
        rangeGroup,
        { aside: btn('Add range', { variant: 'link' }) },
      )}${section('Listening', listeningGroup)}</div></aside>`

      const popover = `<div class="ds-pop c-optpop">${section(
        'Grid size',
        density,
        { flush: true },
      )}${section('Ranges', rangeGroup, { aside: btn('Add range', { variant: 'link' }) })}${section(
        'Listening',
        listeningGroup,
      )}${section('On cards', `<div class="c-group">${check('Rating', true)}${check('Tags', false)}</div>`)}</div>`

      const inline = `<div class="c-inline">${D.tabs(['Filters', 'Columns', 'View'], 0)}<div class="c-row">${select(['Released'], { label: 'Field' })}<input class="ds-input" value="2012" aria-label="Minimum" /><input class="ds-input" value="2025" aria-label="Maximum" />${btn('Add range', { variant: 'link' })}</div><div class="c-row">${select(['Played in the last year'], { label: 'Listening' })}</div></div>`

      /* Now --------------------------------------------------------------- */

      const nowBrowse = `<div class="ds-toolbar">${search('Search albums', { ai: true })}${select(['Added'], { label: 'Sort' })}${dir}${btn('Filters · 2', { icon: 'filter' })}${views()}${seg(['Compact', 'Standard', 'Roomy'], 1, { label: 'Grid density' })}${count('14 of 128 albums')}</div>`
      const nowDrawer = `<div class="ds-toolbar">${search('Search albums', {})}${select(['Title'], { label: 'Sort' })}${dir}${views()}${seg(['Compact', 'Standard', 'Roomy'], 1, { label: 'Grid density' })}${count('14 results')}</div>`
      const nowPhone = `<div class="ds-toolbar">${search('Search albums', {})}${select(['Title'], { label: 'Sort' })}${dir}${views()}${seg(['Compact', 'Standard', 'Roomy'], 0, { label: 'Grid density' })}${count('14 results')}</div>`

      D.page({
        title: 'Concept: compact Browse toolbar',
        lede: 'The toolbar has to hold search, sort, direction, the view switch and one control for everything else, on a Browse page, in a list inside a detail and on a phone. Today grid density takes a fifth of the row, a list inside a detail has a plain search and a short sort list, and nothing leads from that list to the same result in Browse. No existing component covers a searchable sort list or a single control that holds filters, columns and grid size.',
        sections: [
          {
            id: 'now',
            title: 'Now',
            body:
              `<div class="c-frames">${frame('Browse page, 1040px', 1040, nowBrowse, { kind: 'browse' })}</div><div class="c-frames" style="margin-top:16px">${frame('Albums tab of an artist, in the 600px drawer', 600, artistTabs + nowDrawer, { kind: 'drawer' })}${frame('The same tab on a phone, 375px', 375, artistTabs.replace(/<button type="button" class="ds-tab" role="tab" aria-selected="false">(Listening|Sources)<\/button>/g, '') + nowPhone, { kind: 'phone' })}</div>` +
              g.rules([
                'Grid density is three labelled buttons in the row, on every page and in every grid inside a detail.',
                'A list inside a detail searches plain text only, sorts by three to five of its own columns, and has no ranges, Listening filters or field filters.',
                'On a phone the controls take three lines before the first item.',
                'The sort list is a native select: it cannot be searched on a phone, and it is as wide as its longest field name.',
              ]),
          },
          {
            id: 'common',
            title: 'The same in every option',
            body:
              g.spec(
                g.flow(
                  [
                    g.item(sortPick('Added'), 'sort, closed'),
                    g.item(
                      sortPick('Scrobbles, last year'),
                      'a long name is cut short',
                    ),
                    g.item(sortPop(sortFields), 'open'),
                    g.item(
                      sortPop(
                        [['Scrobbles'], ['Scrobbles, last year', true]],
                        'scr',
                      ),
                      'after typing',
                    ),
                    g.item(
                      `<div class="ds-toolbar" style="padding:0">${openIn('Open in Albums')}${openIn('')}</div>`,
                      'Open in Browse, with and without its label',
                    ),
                  ],
                  { top: true },
                ),
              ) +
              g.spec(filterLine, { flush: true, style: 'padding-top:8px' }) +
              g.rules([
                '<b>One order:</b> search, sort, direction, view switch, the one button, then the count. The search is the Browse search with field suggestions and AI search, on Browse pages and inside details alike.',
                '<b>Sort</b> is a button with the select’s box and a fixed width of 112px; a longer field name ends in an ellipsis and shows in full on hover. It opens a list of every sortable field with a search field above it, focused on opening. Typing narrows the list, Enter picks the first match, Escape closes it. On a phone it opens as a sheet from the bottom edge.',
                '<b>Grid size</b> (Compact, Standard, Roomy) leaves the row. It is the first control under View in whatever the one button opens.',
                '<b>The one button</b> holds field ranges, Listening filters, columns and their order, grid size and what cards show. It carries the number of filters that are on.',
                '<b>Open in Browse</b> is a ghost button at the end of the row in a list inside a detail. It opens the matching Browse page with the same scope, search, filters, sort, direction and view. It shows its label where the row has room and the icon alone where it does not.',
                '<b>Active filters inside a detail</b> sit on a line under the toolbar as removable pills, with the filtered count and Clear. The line is absent while nothing is filtered. Browse pages keep their filters in the rail.',
                '<b>The count</b> stays at the end of the row on a Browse page. Inside a detail the tab already carries the total, so the count appears only on the filter line.',
                '<b>On a phone</b> the search takes the first line and everything else the second: two lines where there are three today.',
              ]),
          },
          {
            id: 'option-a',
            title: 'Option A · Filters drawer',
            body:
              `<p>The button keeps the name Filters on a Browse page and is an icon with the filter count where the row is short. It opens the drawer Browse has today, which gains a View section.</p>` +
              threeWidths({
                more: (width) =>
                  width === 'browse'
                    ? more({ label: 'Filters', count: 2 })
                    : more({ count: 2 }),
              }) +
              g.sub('What it opens') +
              g.spec(
                g.flow(
                  [
                    g.item(
                      drawer,
                      'the drawer, from the right edge; full width on a phone',
                    ),
                  ],
                  { top: true },
                ),
              ) +
              g.rules([
                '<b>For:</b> the drawer exists and already holds ranges, Listening and columns, with room for their forms. Lists inside a playlist already open it. Only the row changes.',
                '<b>For:</b> one place for everything at every width.',
                '<b>Against:</b> inside a detail it is a second drawer over the first, and changing grid size means opening and closing it.',
                '<b>Against:</b> on a phone it covers the list, so a filter’s effect shows only after closing.',
              ]),
          },
          {
            id: 'option-b',
            title: 'Option B · Popover under the button',
            body:
              `<p>The button is an icon at every width and opens a popover under itself. Columns appear in it while Table is shown, grid size while Grid is shown.</p>` +
              threeWidths({
                more: () => more({ count: 2 }),
              }) +
              g.sub('What it opens') +
              g.spec(
                g.flow(
                  [
                    g.item(
                      popover,
                      'the popover, 320px; a sheet from the bottom edge on a phone',
                    ),
                  ],
                  { top: true },
                ),
              ) +
              g.rules([
                '<b>For:</b> stays beside the control and over a small part of the list, so a change shows at once. No second drawer inside a detail.',
                '<b>For:</b> grid size is two clicks away.',
                '<b>Against:</b> range and Listening forms are tight at 320px, and a long column list scrolls inside the popover.',
                '<b>Against:</b> a new surface to build, and Browse pages would have two filter surfaces unless the drawer is retired.',
              ]),
          },
          {
            id: 'option-c',
            title: 'Option C · Panel in place',
            body:
              `<p>The button is an icon that stays pressed while a panel is open between the toolbar and the list. The panel has three tabs: Filters, Columns and View.</p>` +
              threeWidths({
                more: () => more({ count: 2, open: true }),
                under: {
                  browse: inline,
                  drawer: inline + filterLine,
                  phone: inline + filterLine,
                },
              }) +
              g.rules([
                '<b>For:</b> nothing covers the list, and results change under the panel while a filter is edited. It behaves the same on a page, in a detail and on a phone.',
                '<b>Against:</b> it takes the list’s height. A list inside a detail is at most 420px tall, so an open panel leaves room for one row of cards.',
                '<b>Against:</b> a second strip of tabs directly under the detail’s own tabs.',
                '<b>Against:</b> a new surface to build; the drawer’s sections would be rebuilt as tabs.',
              ]),
          },
          {
            id: 'recommendation',
            title: 'Recommendation',
            body: g.note(
              'Recommended',
              'Option A. It reuses the drawer that already holds every filter form, so the work is the row, the sort picker and the View section, and Browse pages and lists inside details stay identical. The owner decides.',
            ),
          },
        ],
      })
    </script>
  </body>
</html>
