name: Deploy production

on:
  workflow_call:
    secrets:
      PROVIDER_ONE_REPOSITORY:
        required: true
      PROVIDER_TWO_REPOSITORY:
        required: true
      PROVIDER_ONE_REVISION:
        required: true
      PROVIDER_TWO_REVISION:
        required: true
      PROVIDER_ONE_DEPLOY_KEY:
        required: true
      PROVIDER_TWO_DEPLOY_KEY:
        required: true
      PROVIDER_ONE_ENTRYPOINT:
        required: true
      PROVIDER_TWO_ENTRYPOINT:
        required: true
      CLOUDFLARE_APP_URL:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      MIGRATION_CHECK_DATABASE_URL:
        required: false
      BROWSE_CHECK_SESSION_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-workers
      cancel-in-progress: false
      queue: max
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # Commit history without old file contents, for the migration check.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned provider source
        env:
          PROVIDER_ONE_REPOSITORY: ${{ secrets.PROVIDER_ONE_REPOSITORY }}
          PROVIDER_TWO_REPOSITORY: ${{ secrets.PROVIDER_TWO_REPOSITORY }}
          PROVIDER_ONE_REVISION: ${{ secrets.PROVIDER_ONE_REVISION }}
          PROVIDER_TWO_REVISION: ${{ secrets.PROVIDER_TWO_REVISION }}
          PROVIDER_ONE_DEPLOY_KEY: ${{ secrets.PROVIDER_ONE_DEPLOY_KEY }}
          PROVIDER_TWO_DEPLOY_KEY: ${{ secrets.PROVIDER_TWO_DEPLOY_KEY }}
        run: bash .github/scripts/checkout-providers.sh
      - name: Build Worker bundles
        env:
          PROVIDER_ONE_ENTRYPOINT: ${{ secrets.PROVIDER_ONE_ENTRYPOINT }}
          PROVIDER_TWO_ENTRYPOINT: ${{ secrets.PROVIDER_TWO_ENTRYPOINT }}
          CLOUDFLARE_APP_URL: ${{ secrets.CLOUDFLARE_APP_URL }}
        run: bash .github/scripts/release-workers.sh build
      - name: Check main tip before publishing
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)"; then
            echo "::error::Could not verify the current main revision."
            exit 1
          fi
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped publishing because main advanced."
          fi
      - name: Check production has this commit's migrations
        if: steps.main.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_APP_URL: ${{ secrets.CLOUDFLARE_APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIGRATION_CHECK_DATABASE_URL: ${{ secrets.MIGRATION_CHECK_DATABASE_URL }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/release-workers.sh migrations
      - name: Publish API and web Workers and verify the release
        if: steps.main.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_APP_URL: ${{ secrets.CLOUDFLARE_APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/release-workers.sh publish
      - name: Signed-in Browse check
        if: steps.main.outputs.current == 'true'
        env:
          CLOUDFLARE_APP_URL: ${{ secrets.CLOUDFLARE_APP_URL }}
          BROWSE_CHECK_SESSION_TOKEN: ${{ secrets.BROWSE_CHECK_SESSION_TOKEN }}
        run: bash .github/scripts/release-workers.sh browse
      - name: Report the commit each Worker serves
        if: failure() || cancelled()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_APP_URL: ${{ secrets.CLOUDFLARE_APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/release-workers.sh served
