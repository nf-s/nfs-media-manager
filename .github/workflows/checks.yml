name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  APP_URL: http://localhost:3000
  AUTH_BASE_URL: http://localhost:4000
  INTERNAL_BACKEND_URL: http://localhost:4000
  TRUSTED_ORIGINS: http://localhost:3000,http://localhost:4000
  DATABASE_HOST: localhost
  DATABASE_PORT: 5432
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  DATABASE_NAME: media_manager_ci
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-characters
  MEDIA_ENCRYPTION_KEY: ci-only-media-encryption-key-at-least-32-characters
  MEDIA_PLUGIN_PATHS: ''

jobs:
  integration:
    name: Server integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: media_manager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d media_manager_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: |
          pnpm --filter @repo/schemas build
          pnpm --filter @repo/media-plugin-sdk build
      - name: Server integration tests
        run: pnpm --filter @repo/server test:integration --shard=${{ matrix.shard }}/3

  unit-and-types:
    name: Unit tests and typechecks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: |
          pnpm --filter @repo/schemas build
          pnpm --filter @repo/media-plugin-sdk build
          pnpm --filter @repo/server build:types
      - name: Typecheck
        run: |
          pnpm --filter @repo/server typecheck
          pnpm --filter web typecheck
      - name: Build and start the API Worker locally
        env:
          NODE_ENV: production
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
          CLOUDFLARE_APP_URL: https://app.example.invalid
          CLOUD_OWNER_EMAIL: owner@example.invalid
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm --filter @repo/server build:cloudflare
      - name: Schema unit tests
        run: pnpm --filter @repo/schemas test:unit
      - name: Server unit tests
        run: pnpm --filter @repo/server test:unit
      - name: Web component and utility tests
        run: >-
          apps/server/node_modules/.bin/tsx
          --tsconfig apps/web/tsconfig.test.json
          --test apps/web/components/*.test.ts apps/web/components/*.test.tsx apps/web/hooks/*.test.ts apps/web/utils/*.test.ts

  checks:
    if: always()
    needs: [integration, unit-and-types]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          UNIT_AND_TYPES_RESULT: ${{ needs.unit-and-types.result }}
        run: |
          test "$INTEGRATION_RESULT" = success
          test "$UNIT_AND_TYPES_RESULT" = success

  query-performance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/query-performance.yml

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, query-performance]
    uses: ./.github/workflows/deploy-production.yml
    secrets:
      PROVIDER_ONE_REPOSITORY: ${{ secrets.PROVIDER_ONE_REPOSITORY }}
      PROVIDER_TWO_REPOSITORY: ${{ secrets.PROVIDER_TWO_REPOSITORY }}
      PROVIDER_ONE_REVISION: ${{ secrets.PROVIDER_ONE_REVISION }}
      PROVIDER_TWO_REVISION: ${{ secrets.PROVIDER_TWO_REVISION }}
      PROVIDER_ONE_DEPLOY_KEY: ${{ secrets.PROVIDER_ONE_DEPLOY_KEY }}
      PROVIDER_TWO_DEPLOY_KEY: ${{ secrets.PROVIDER_TWO_DEPLOY_KEY }}
      PROVIDER_ONE_ENTRYPOINT: ${{ secrets.PROVIDER_ONE_ENTRYPOINT }}
      PROVIDER_TWO_ENTRYPOINT: ${{ secrets.PROVIDER_TWO_ENTRYPOINT }}
      CLOUDFLARE_APP_URL: ${{ secrets.CLOUDFLARE_APP_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MIGRATION_CHECK_DATABASE_URL: ${{ secrets.MIGRATION_CHECK_DATABASE_URL }}
      BROWSE_CHECK_SESSION_TOKEN: ${{ secrets.BROWSE_CHECK_SESSION_TOKEN }}
